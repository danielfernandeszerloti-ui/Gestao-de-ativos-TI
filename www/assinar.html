<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1b33">
<title>Termo de Responsabilidade — Zerbini</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="termo-pdf.js"></script>
<style>
/* Página de documento: papel claro, cabeçalho azul-marinho da Zerbini, uma coluna legível no celular */
:root{--paper:#ffffff;--bg:#eef2f7;--ink:#1e293b;--muted:#64748b;--line:#d5dde8;--navy:#0f1b33;--blue:#1d4ed8;--soft:#eef4ff;--ok:#0a7a52;--okbg:#e3f7ee;--warn:#955800;--warnbg:#fff2da;--danger:#c62828;
  --f:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;padding-block:0 40px}
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo img{width:34px;height:34px}
.top b{display:block;font-size:18px;font-weight:800;line-height:1.1}
.top small{font-size:12.5px;opacity:.8}
main{max-width:760px;margin:0 auto;padding-inline:16px}
.doc{background:var(--paper);border-radius:14px;box-shadow:0 6px 24px rgba(15,27,51,.08);padding:22px clamp(16px,4vw,32px);margin-top:18px}
h1{margin:0;font-size:clamp(20px,5vw,26px);font-weight:800;color:var(--navy);line-height:1.2}
h1 span{display:block;color:var(--blue);font-size:.72em;margin-top:2px}
.intro{margin:16px 0 10px;color:var(--ink)}
ol.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.cl li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
ol.cl li i{font-style:normal;width:28px;height:28px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
h2{font-size:15px;font-weight:800;color:var(--navy);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv div{min-width:0}
.kv label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kv p{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.cond{display:inline-block;background:var(--soft);color:var(--blue);border-radius:6px;padding:2px 10px;font-weight:800;font-size:14px}
form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:13px;font-weight:800;color:var(--muted)}
.fld span i{color:var(--danger);font-style:normal}
.fld input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink);width:100%}
.fld input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--soft)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pad{position:relative;border:2px dashed #9fb3d1;border-radius:12px;background:#fbfdff;height:200px;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;cursor:crosshair}
.pad .hint{position:absolute;left:0;right:0;bottom:36%;text-align:center;color:#9fb3d1;font-weight:700;pointer-events:none}
.pad .base{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #c7d4e6;pointer-events:none}
.padbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--blue);font:inherit;font-weight:800;cursor:pointer;padding:4px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:700;background:var(--soft);border-radius:10px;padding:14px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:15px;background:linear-gradient(90deg,#0ea5e9,#2563eb);color:#fff;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--danger);font-weight:700}
.state{text-align:center;padding:36px 20px}
.state .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:32px;font-weight:800}
.state.ok .ic{background:var(--okbg);color:var(--ok)}
.state.warn .ic{background:var(--warnbg);color:var(--warn)}
.state h1{font-size:22px}
.state p{color:var(--muted);max-width:460px;margin:10px auto 0}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--navy);background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block;margin-top:12px;letter-spacing:.04em}
.foot{color:var(--muted);font-size:12.5px;margin-top:16px;text-align:center}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo"><img src="img/logo-128.png?v=2" alt="Zerbini do Brasil"></div><div><b>Zerbini do Brasil</b><small>Termo de responsabilidade · TI</small></div></div></header>
<main><div class="doc" id="app"><div class="state"><p>Carregando o termo…</p></div></div>
<p class="foot">Assinatura eletrônica registrada com data, hora, IP e código de verificação.</p></main>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T = window.TERMO, CFG = window.GA_CONFIG || {};
const app = $("#app");
const token = decodeURIComponent((location.hash || "").slice(1)).trim();
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const TIPOS = {notebook:"Notebook",celular:"Celular",tablet:"Tablet",impressora:"Impressora",coletor:"Coletor",monitor:"Monitor"};

function estado(cls, ic, titulo, texto, extra = "") {
  app.innerHTML = `<div class="state ${cls}"><div class="ic">${ic}</div><h1>${titulo}</h1><p>${texto}</p>${extra}</div>`;
}
function assinadoView(d) {
  estado("ok", "✓", "Termo assinado", `Assinado em ${esc(T.fmtDataHora(d.assinado_em))} (horário de Brasília). A TI já tem o documento registrado. Você pode fechar esta página.`,
    d.hash ? `<div class="code">Código de verificação: ${esc(T.codigo(d.hash))}</div>` : "");
}

async function carregar() {
  if (token.length < 32) return estado("warn", "!", "Link incompleto", "Abra o link exatamente como a TI enviou. Se o problema continuar, peça um novo link.");
  let d;
  try { const r = await sb.rpc("termo_publico", { p_token: token }); if (r.error) throw r.error; d = r.data; }
  catch (e) { console.error(e); return estado("warn", "!", "Sem conexão", "Não foi possível carregar o termo. Verifique a internet e recarregue a página."); }
  if (!d) return estado("warn", "!", "Link inválido", "Este link não existe ou foi digitado errado. Peça um novo link à TI.");
  if (d.status === "assinado" || d.status === "devolvido") return assinadoView(d);
  if (d.status === "cancelado") return estado("warn", "!", "Termo cancelado", "Este termo foi cancelado pela TI. Se você recebeu um link mais recente, use o novo.");
  if (d.status === "expirado") return estado("warn", "!", "Link expirado", "O prazo para assinar este termo terminou. Peça um novo link à TI.");
  render(d);
}

function render(d) {
  const cond = (T.CONDICOES.find(c => c[0] === d.condicao) || ["", ""])[1];
  app.innerHTML = `
    <h1>Termo de Responsabilidade<span>Empréstimo de equipamento</span></h1>
    <p class="intro">${esc(T.INTRO)}</p>
    <ol class="cl">${T.CLAUSULAS.map((c, i) => `<li><i>${i + 1}</i><div>${esc(c)}</div></li>`).join("")}</ol>
    <h2>Dados do equipamento</h2>
    <div class="kv">
      <div><label>Patrimônio</label><p>${esc(d.dispositivo)}</p></div>
      <div><label>Tipo</label><p>${esc(TIPOS[d.tipo] || d.tipo || "—")}</p></div>
      <div><label>Marca</label><p>${esc(d.marca || "—")}</p></div>
      <div><label>Modelo</label><p>${esc(d.modelo || "—")}</p></div>
      <div><label>Nº de série</label><p>${esc(d.serie || "—")}</p></div>
      <div><label>Estado na entrega</label><p><span class="cond">${esc(cond)}</span></p></div>
      ${d.obs ? `<div style="grid-column:1/-1"><label>Observações</label><p>${esc(d.obs)}</p></div>` : ""}
      <div><label>Entregue por</label><p>${esc(d.entregue_por_nome || "TI")}</p></div>
      <div><label>Data</label><p>${esc(T.fmtData(d.criado_em))}</p></div>
    </div>
    <h2>Seus dados</h2>
    <form id="f" novalidate>
      <label class="fld"><span>Nome completo <i>*</i></span><input id="nome" autocomplete="name" required minlength="5" maxlength="150" value="${esc(d.colaborador_nome)}"></label>
      <div class="row2">
        <label class="fld"><span>Cargo / função</span><input id="cargo" autocomplete="organization-title" maxlength="80" value="${esc(d.cargo)}"></label>
        <label class="fld"><span>Telefone</span><input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(11) 99999-9999" value="${esc(d.telefone)}"></label>
      </div>
      <label class="fld"><span>E-mail corporativo</span><input id="email" type="email" autocomplete="email" maxlength="120" value="${esc(d.colaborador_email)}"></label>
      <div class="fld"><span>Assinatura <i>*</i></span>
        <div class="pad" id="pad"><div class="base"></div><div class="hint" id="hint">Assine aqui com o dedo ou o mouse</div><canvas id="cv" aria-label="Área de assinatura"></canvas></div>
        <div class="padbar"><span>Assine como no seu documento.</span><button type="button" class="link" id="limpar">Limpar</button></div>
      </div>
      <label class="check"><input type="checkbox" id="aceite"><span>${esc(T.DECLARACAO)}</span></label>
      <div class="err" id="err" hidden></div>
      <button class="btn" id="enviar">Assinar termo</button>
      <p style="margin:0;font-size:13px;color:var(--muted)">Ao assinar, ficam registrados data, hora, endereço IP e aparelho usados, junto com um código de verificação do documento.</p>
    </form>`;
  initPad();
  $("#tel").addEventListener("input", e => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 11);
    e.target.value = v.length > 10 ? `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}` : v.length > 6 ? `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}` : v.length > 2 ? `(${v.slice(0,2)}) ${v.slice(2)}` : v;
  });
  $("#f").addEventListener("submit", enviar);
}

// ---- área de assinatura ----
let cv, ctx, desenhou = false, strokes = 0;
function initPad() {
  cv = $("#cv"); ctx = cv.getContext("2d");
  const fit = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const img = desenhou ? cv.toDataURL() : null;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#13206b"; ctx.lineWidth = 2.6;
    if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, r.width, r.height); i.src = img; }
  };
  fit(); window.addEventListener("resize", fit);
  let last = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 7); ctx.fillStyle = "#13206b"; ctx.fill(); });
  cv.addEventListener("pointermove", e => {
    if (!last) return; e.preventDefault();
    const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    if (Math.hypot(p.x - last.x, p.y - last.y) > 0.5) { desenhou = true; $("#hint").hidden = true; }
    last = p;
  });
  const fim = () => { if (last) strokes++; last = null; };
  cv.addEventListener("pointerup", fim); cv.addEventListener("pointercancel", fim); cv.addEventListener("pointerleave", fim);
  $("#limpar").addEventListener("click", () => { ctx.clearRect(0, 0, cv.width, cv.height); desenhou = false; strokes = 0; $("#hint").hidden = false; });
}
// recorta a área desenhada e reduz para no máximo 900px de largura
function assinaturaPNG() {
  const w = cv.width, h = cv.height, data = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (data[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 - x0 < 30 || y1 - y0 < 10) return null;
  const pad = 12; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
  const s = Math.min(1, 900 / (x1 - x0)); const o = document.createElement("canvas");
  o.width = Math.round((x1 - x0) * s); o.height = Math.round((y1 - y0) * s);
  o.getContext("2d").drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, o.width, o.height);
  return o.toDataURL("image/png");
}

async function enviar(e) {
  e.preventDefault();
  const err = $("#err"), btn = $("#enviar"); err.hidden = true;
  const nome = $("#nome").value.trim().replace(/\s+/g, " ");
  const falha = m => { err.textContent = m; err.hidden = false; };
  if (nome.split(" ").length < 2 || nome.length < 5) return falha("Informe seu nome completo (nome e sobrenome).");
  const email = $("#email").value.trim();
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return falha("O e-mail informado não parece válido.");
  const png = desenhou ? assinaturaPNG() : null;
  if (!png) return falha("Faça sua assinatura no quadro acima.");
  if (!$("#aceite").checked) return falha("Marque a declaração de que leu e está de acordo com o termo.");
  btn.disabled = true; btn.textContent = "Registrando assinatura…";
  try {
    const r = await sb.rpc("assinar_termo", { p_token: token, p_nome: nome, p_cargo: $("#cargo").value, p_telefone: $("#tel").value, p_email: email, p_assinatura: png, p_user_agent: navigator.userAgent });
    if (r.error) throw r.error;
    window.scrollTo(0, 0); assinadoView(r.data);
  } catch (ex) {
    console.error(ex); btn.disabled = false; btn.textContent = "Assinar termo";
    falha(ex && ex.message && !/fetch|network/i.test(ex.message) ? ex.message : "Não foi possível registrar a assinatura. Verifique a internet e tente de novo.");
  }
}
carregar();
})();
</script>
</body>
</html>
