<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ativos TI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gestão de Ativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="termo-pdf.js?v=2.9.0"></script>
<style>
/* Layout: sidebar fixa de TI à esquerda + área de trabalho com cabeçalho, barra de filtros e tabela; vira barra superior no celular */
:root{
  --bg:#f1f8fc; --glow:#dff4fb; --surface:#ffffff; --surface-2:#f6fafd; --border:#dce7f0; --row:#edf3f8;
  --ink:#16223b; --heading:#1c2f6b; --muted:#5d6c86; --faint:#8a98ae;
  --accent:#0aa3d6; --accent-2:#2563eb; --accent-soft:#e2f4fb; --accent-ink:#ffffff;
  --use-bg:#e4edff; --use-fg:#1f3fa6; --use-bd:#b9cdf7;
  --avail-bg:#daf6f5; --avail-fg:#0a7a80; --avail-bd:#9fe3e0;
  --maint-bg:#fff2da; --maint-fg:#955800; --maint-bd:#f3d49a;
  --disc-bg:#eff0f4; --disc-fg:#646a78; --disc-bd:#d5d8e0;
  --res-bg:#f2eaff; --res-fg:#6d28d9; --res-bd:#d8c4fb;
  --ok-bg:#e2f6e9; --ok-fg:#13743a; --ok-bd:#a7dfba;
  --danger:#cf3535; --danger-soft:#fdecec; --shadow:0 6px 24px rgba(28,47,107,.07);
  --f-ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1320; --glow:#0e2233; --surface:#111c2c; --surface-2:#152338; --border:#223350; --row:#1a2940;
  --ink:#e3ebf7; --heading:#cddcff; --muted:#93a4c0; --faint:#6f819e;
  --accent:#36bdf2; --accent-2:#5b9bff; --accent-soft:#0f2e42; --accent-ink:#04121c;
  --use-bg:#172a52; --use-fg:#b8ceff; --use-bd:#2b467c;
  --avail-bg:#0e3336; --avail-fg:#6fe0dd; --avail-bd:#1c5a5c;
  --maint-bg:#3a2a0e; --maint-fg:#f3c66e; --maint-bd:#654a1b;
  --disc-bg:#20242d; --disc-fg:#a4a9b6; --disc-bd:#343a47;
  --res-bg:#2a1d48; --res-fg:#cdb5ff; --res-bd:#4b3680; --ok-bg:#0f3120; --ok-fg:#7ddc9f; --ok-bd:#1f5a37;
  --danger:#f07575; --danger-soft:#3a1a1d; --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1320; --glow:#0e2233; --surface:#111c2c; --surface-2:#152338; --border:#223350; --row:#1a2940;
  --ink:#e3ebf7; --heading:#cddcff; --muted:#93a4c0; --faint:#6f819e;
  --accent:#36bdf2; --accent-2:#5b9bff; --accent-soft:#0f2e42; --accent-ink:#04121c;
  --use-bg:#172a52; --use-fg:#b8ceff; --use-bd:#2b467c;
  --avail-bg:#0e3336; --avail-fg:#6fe0dd; --avail-bd:#1c5a5c;
  --maint-bg:#3a2a0e; --maint-fg:#f3c66e; --maint-bd:#654a1b;
  --disc-bg:#20242d; --disc-fg:#a4a9b6; --disc-bd:#343a47;
  --res-bg:#2a1d48; --res-fg:#cdb5ff; --res-bd:#4b3680; --ok-bg:#0f3120; --ok-fg:#7ddc9f; --ok-bd:#1f5a37;
  --danger:#f07575; --danger-soft:#3a1a1d; --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
select{background-color:var(--surface);color:var(--ink)}
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
select option:checked{background-color:var(--accent-soft);color:var(--heading)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--border);background:color-mix(in srgb,var(--surface) 70%,transparent);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
.brand,.navlabel,.sync{flex:none}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px;border-bottom:1px solid var(--border)}
.logo{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:#ffffff;border:1px solid var(--border);box-shadow:0 4px 12px rgba(28,47,107,.10)}
.logo img{width:36px;height:36px;display:block}
.brand b{display:block;color:var(--heading);font-size:19px;font-weight:800;line-height:1.1}
.brand small{color:var(--accent-2);font-size:12.5px}
.navlabel{padding:22px 20px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
nav.menu{display:flex;flex-direction:column;gap:2px;padding:0 10px 12px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--heading);font-weight:600;text-align:left;border-left:3px solid transparent}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);border-left-color:var(--accent)}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.sync{padding:16px 20px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:6px;flex:none}
.dot.ok{background:#22b573}.dot.local{background:#e0a100}

main{padding-block:34px 60px;padding-inline:clamp(16px,3.5vw,52px);min-width:0}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
h1{margin:0;color:var(--heading);font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:17px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--accent-2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(90deg,#0ea5e9,#2563eb);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(14,165,233,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.ghost{color:var(--muted)}
.btn:disabled{opacity:.55;cursor:wait}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:14px;padding:26px 28px;margin-bottom:30px}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:0 14px;background:var(--surface);min-width:0}
.search svg{color:var(--accent)}
.search input{border:0;outline:0;background:none;padding:12px 0;width:100%;min-width:0}
.search:focus-within{border-color:var(--accent)}
.sel{position:relative;display:flex;align-items:center;border:1px solid var(--border);border-radius:9px;background:var(--surface);flex:0 1 190px}
.sel svg{position:absolute;left:14px;color:var(--accent);pointer-events:none}
.sel select{appearance:none;border:0;background:none;padding:12px 34px 12px 42px;width:100%;cursor:pointer;font-weight:600}
.sel::after{content:"";position:absolute;right:14px;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-3px);pointer-events:none}

.tablewrap{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:15px;padding:16px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
th:first-child,td:first-child{padding-left:10px}
td{padding:9px 12px;border-bottom:1px solid var(--row);color:var(--heading);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
td.dev{font-weight:800;color:var(--heading)}
td.set{color:var(--accent-2)}
.th-r{text-align:right}
.thumb{width:54px;height:54px;border-radius:8px;border:2px solid var(--accent-soft);object-fit:cover;display:block;background:var(--accent-soft)}
.thumb.ph{display:grid;place-items:center;color:var(--accent)}
.thumb.ph svg.i{width:24px;height:24px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.ib{width:38px;height:38px;border-radius:8px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--accent-soft);color:var(--accent-2)}
.ib.del:hover{background:var(--danger-soft);color:var(--danger)}
.pill{display:inline-block;padding:3px 12px;border-radius:7px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.st-uso{background:var(--use-bg);color:var(--use-fg);border-color:var(--use-bd)}
.st-disp{background:var(--avail-bg);color:var(--avail-fg);border-color:var(--avail-bd)}
.st-man{background:var(--maint-bg);color:var(--maint-fg);border-color:var(--maint-bd)}
.st-desc{background:var(--disc-bg);color:var(--disc-fg);border-color:var(--disc-bd)}
.st-sol{background:var(--surface-2);color:var(--heading);border-color:var(--border)}
.st-prep{background:var(--accent-soft);color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.st-res{background:var(--res-bg);color:var(--res-fg);border-color:var(--res-bd)}
.st-ent{background:var(--avail-bg);color:var(--avail-fg);border-color:var(--avail-bd)}
.st-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--heading);font-size:18px;margin-bottom:6px}
.muted{color:var(--faint)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.tile{padding:18px 20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .ti{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.tile .ti span{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center}
.tile .big{font-size:34px;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .mini{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{padding:22px 24px;min-width:0}
.panel h2{margin:0 0 16px;font-size:17px;color:var(--heading);font-weight:800}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--row);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;font-size:14px}
.legend span{display:flex;align-items:center;gap:7px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums}
.catrow{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:12px;align-items:center;margin-top:12px;font-size:14px}
.catrow .stack{height:10px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:6px;background:var(--row);overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px}
.bar b,.catrow b{text-align:right;font-variant-numeric:tabular-nums;color:var(--heading)}
.bar span,.catrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--row);cursor:pointer}
.li:last-child{border-bottom:0}
.li b{min-width:70px;color:var(--heading)}
.li span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,18,35,.45);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px));z-index:50}
.modal{background:var(--surface);border-radius:16px;width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.mhead{flex:none;padding:22px clamp(18px,2.5vw,32px) 0}
.mbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 clamp(18px,2.5vw,32px) 24px}
.modal.sm{width:min(520px,100%)}
.modal.md{width:min(860px,100%)}
.modal h2{margin:0;font-size:clamp(20px,2.2vw,28px);font-weight:800;color:var(--heading);padding-bottom:16px;border-bottom:1px solid var(--border);padding-right:44px;text-wrap:balance}
.close{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;border:1.6px solid var(--muted);background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.close svg.i{width:15px;height:15px}
.detail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;padding-top:22px;align-items:start}
.photo{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);display:grid;place-items:center;min-height:240px;overflow:hidden;position:sticky;top:0}
.photo img{width:100%;max-height:min(70vh,520px);object-fit:contain;display:block}
.photo .ph{color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.photo .ph svg.i{width:48px;height:48px;stroke-width:1.3}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px;align-content:start}
.kv.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv div{min-width:0}
.kv label,.obs label{display:block;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:4px}
.kv p,.obs p{margin:0;font-size:16.5px;color:var(--ink);overflow-wrap:anywhere}
.kv .pill{font-size:16px;font-weight:500;padding:6px 14px;border-radius:8px}
.obs{border-top:1px solid var(--border);padding-top:16px;margin-top:4px;grid-column:1/-1}
.obs p{white-space:pre-wrap}
.split{display:contents}

form.f{padding-top:22px;display:flex;flex-direction:column;gap:22px}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px}
legend.l{grid-column:1/-1;font-weight:800;color:var(--heading);font-size:15px;padding:0;margin-bottom:2px;float:left;width:100%}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld span{font-size:13.5px;font-weight:700;color:var(--muted)}
.fld span i{color:var(--danger);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.wide{grid-column:1/-1}
.fld textarea{min-height:80px;resize:vertical}
.upl{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upl .prev{width:110px;height:110px;border-radius:10px;border:1px dashed var(--border);display:grid;place-items:center;overflow:hidden;background:var(--surface-2);color:var(--faint)}
.upl .prev img{width:100%;height:100%;object-fit:cover}
.foot{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px}
.msg{padding-top:18px;color:var(--ink)}
.msg p{margin:0 0 10px}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.hdrs{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-word}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--heading);color:var(--surface);padding:12px 20px;border-radius:10px;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.navsep{padding:18px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
/* etiquetas */
.etq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.opt{display:flex;flex-direction:column;gap:18px}
.opt fieldset{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:9px 10px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-2)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.pick{border:1px solid var(--border);border-radius:10px;max-height:300px;overflow-y:auto}
.pick label{display:grid;grid-template-columns:20px 72px minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--row);cursor:pointer;font-size:14px}
.pick label:last-child{border-bottom:0}
.pick label b{color:var(--heading)}
.pick label span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick input{accent-color:var(--accent-2);width:16px;height:16px}
.pickbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent-2);font-weight:700;cursor:pointer;padding:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check.fld{flex-direction:row}
.check input{accent-color:var(--accent-2);width:16px;height:16px;margin-top:2px}
.stage{--paper:#ffffff;--paper-ink:#000000;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:28px 18px;display:grid;place-items:center;gap:12px}
.stage svg{width:100%;max-width:440px;height:auto;background:var(--paper);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:block}
.stage small{color:var(--muted);font-size:13px}
.bigcount{font-size:28px;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums}
.dl{display:flex;flex-direction:column;gap:10px}
.dl .btn{justify-content:flex-start}
.dl .btn small{margin-left:auto;color:var(--muted);font-weight:600}
.req{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.req ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.req li b{color:var(--heading)}
/* inventário */
.scan{display:flex;gap:14px;align-items:center;padding:22px 24px;flex-wrap:wrap}
.scanbox{flex:1 1 360px;display:flex;align-items:center;gap:12px;border:2px solid var(--accent);border-radius:12px;padding:0 16px;background:var(--surface);min-width:0}
.scanbox svg.i{width:26px;height:26px;color:var(--accent)}
.scanbox input{border:0;outline:0;background:none;padding:16px 0;font-size:22px;font-weight:800;letter-spacing:.04em;width:100%;min-width:0;text-transform:uppercase;color:var(--heading)}
.fb{flex:1 1 280px;padding:12px 16px;border-radius:10px;font-weight:700;border:1px solid var(--border);color:var(--muted);min-width:0}
.fb.ok{background:var(--avail-bg);color:var(--avail-fg);border-color:var(--avail-bd)}
.fb.dup{background:var(--use-bg);color:var(--use-fg);border-color:var(--use-bd)}
.fb.bad{background:var(--maint-bg);color:var(--maint-fg);border-color:var(--maint-bd)}
.prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-bottom:6px}
.prog .pct{font-size:40px;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1}
.track2{height:12px;border-radius:7px;background:var(--row);overflow:hidden}
.track2 i{display:block;height:100%;background:linear-gradient(90deg,#22b573,var(--avail-fg))}
.li.done b{color:var(--avail-fg)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panelhead h2{margin:0}
.panelhead select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface)}
.scroll{max-height:420px;overflow-y:auto}
@media (max-width:1100px){.etq{grid-template-columns:1fr}}
/* login */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px 16px;background:var(--bg);background-image:radial-gradient(900px 420px at 80% -10%,var(--glow),transparent 70%);overflow-y:auto}
.gate .box{width:min(420px,100%);padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.gate .brand{padding:0;border:0}
.gate h2{margin:6px 0 0;color:var(--heading);font-size:22px;font-weight:800}
.gate p{margin:0;color:var(--muted);font-size:14.5px}
.gate .btn{justify-content:center}
.gate .err{color:var(--danger);font-weight:700;font-size:14px}
.gate .ok{color:var(--avail-fg);font-weight:700;font-size:14px}
.gate .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand .out{margin-left:auto}
.hist{border-top:1px solid var(--border);padding-top:16px}
.hist label{display:block;color:var(--muted);font-weight:600;font-size:14.5px;margin-bottom:8px}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist li{display:flex;gap:10px;flex-wrap:wrap}
.hist time{color:var(--faint);font-variant-numeric:tabular-nums;min-width:92px}
.hist em{font-style:normal;color:var(--muted)}
.acc{margin-top:24px;padding:22px 24px}
.acc h2{margin:0 0 6px;font-size:17px;color:var(--heading);font-weight:800}
.acc form{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.acc form input,.acc form select,.acc td select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;background:var(--surface)}
.acc form input{flex:1 1 240px;min-width:0}
.acc table{min-width:520px}
/* termos */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tlist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;padding:6px 0;border-bottom:1px solid var(--row)}
.tlist li:last-child{border-bottom:0}
.tlist li>.who{flex:1;min-width:0}
.tlist .ib{width:34px;height:34px}
.linkbox{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start;margin:14px 0}
.linkbox .qr{background:#ffffff;border-radius:10px;padding:8px;border:1px solid var(--border)}
.linkbox .qr svg{width:100%;height:auto;display:block}
.linkbox .acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}
.linkbox .acts .btn{text-decoration:none}
.seg{flex-wrap:wrap}
fieldset .seg,fieldset .check{grid-column:1/-1}
.tpills{display:flex;flex-wrap:wrap;gap:6px}
.tpills button{border:0;cursor:pointer;font:inherit}
.origem{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle}
.imptab{min-width:820px}
.imptab td{padding:6px 8px;vertical-align:middle}
.imptab input[type=text],.imptab input[type=date]{border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--surface);width:100%;min-width:0}
.imptab input.bad{border-color:var(--maint-bd);background:var(--maint-bg)}
.imptab .fn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.imptab .st{font-size:13px;min-width:120px}
.imptab .st.ok{color:var(--avail-fg);font-weight:700}
.imptab .st.err{color:var(--danger);font-weight:700}
.warnnote{background:var(--maint-bg);color:var(--maint-fg);border:1px solid var(--maint-bd);border-radius:10px;padding:10px 12px;font-size:14px}
/* onboarding */
.btn.sm{padding:7px 12px;font-size:14px;gap:6px}
.ib.sm{width:30px;height:30px}
.otiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.otile{padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:inherit}
.otile b{font-size:26px;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1}
.otile .pill{align-self:flex-start;font-size:11.5px;padding:2px 8px;white-space:normal}
.otile:hover,.otile.on{border-color:var(--accent)}
.otile.on{box-shadow:0 0 0 3px var(--accent-soft)}
.oalert{margin-bottom:20px}
.al{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--row);cursor:pointer}
.al:last-child{border-bottom:0}
.al>i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.al.late>i{background:var(--danger)}.al.soon>i{background:#e0a100}
.al b{color:var(--heading);min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.al span{color:var(--muted);font-size:14px;flex:1;min-width:0}
.al.late span{color:var(--danger);font-weight:700}
.pz{white-space:nowrap}.pz.late{color:var(--danger);font-weight:800}.pz.soon{color:var(--maint-fg);font-weight:800}.pz.ok{color:var(--ok-fg)}
.mprog{height:6px;border-radius:4px;background:var(--row);overflow:hidden;margin-top:6px;width:110px}
.mprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}
tr.click{cursor:pointer}
.dt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:0 12px;background:var(--surface);font-size:13px;color:var(--muted);font-weight:700;flex:0 1 auto}
.dt input{border:0;background:none;padding:11px 0;min-width:0;color:var(--ink)}
.ostsel{flex:0 1 230px}
.osum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.osum .card{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.osum label{color:var(--muted);font-weight:700;font-size:13px}
.osum b{font-size:26px;color:var(--heading);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.osum small{color:var(--muted);font-size:13px}
.odet{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.ocol{display:flex;flex-direction:column;gap:20px;min-width:0}
.oeq{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.oeqh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;color:var(--heading)}
.oln{display:flex;align-items:center;gap:10px;padding:8px 0 0}
.oln>div{flex:1;min-width:0}
.oln small{display:block;color:var(--muted);font-size:13px}
.oln .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.ogrp h3{margin:16px 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ogrp:first-of-type h3{margin-top:4px}
.ock{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--row);font-size:14.5px}
.ock input{accent-color:var(--accent-2);width:18px;height:18px;margin-top:2px;flex:none}
.ock .tx{flex:1;min-width:0;cursor:pointer}
.ock input:disabled+.tx{cursor:default}
.ock.done .tx>span{color:var(--muted);text-decoration:line-through}
.ock small{display:block;color:var(--faint);font-size:12px}
.auto{font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.ockadd,.ocfgadd{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ockadd input,.ocfgadd input,.ocfgadd select{flex:1 1 160px;min-width:0;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface)}
.osol{display:grid;gap:6px}
.osol>label{color:var(--muted);font-weight:700;font-size:13px;margin-top:6px}
.ocom{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.ocom textarea{flex:1;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--surface);resize:vertical}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:520px;overflow-y:auto}
.tl li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--row);font-size:14px}
.tl time{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.tl .who{display:block;color:var(--muted);font-size:12.5px}
.tl .msgc{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;white-space:pre-wrap;margin-top:3px}
.ochecks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px}
.pk{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;max-height:min(52vh,420px);overflow-y:auto}
.pkrow{display:flex;gap:12px;align-items:center;padding:11px 12px;border:0;border-bottom:1px solid var(--row);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.pkrow:last-child{border-bottom:0}
.pkrow:hover{background:var(--accent-soft)}
.pkrow b{min-width:84px;color:var(--heading)}
.pkrow span{color:var(--muted);font-size:14px;flex:1;min-width:0}
.cfgt{min-width:520px}
.cfgt td{padding:6px 8px}
.cfgt input[type=text],.cfgt input[type=number],.cfgt select{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--surface);width:100%;min-width:0}
.cfgt input[type=number]{width:72px}
.cfgt td:has(.auto){display:flex;align-items:center}
.cdet{margin:6px 0 0;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.cdet.muted{color:var(--faint);font-size:12.5px}
.cdet.late{color:var(--danger);font-weight:700}
.btn.ghost.del{color:var(--danger)}
.btn.ghost.del:hover{border-color:var(--danger)}
.cdet.okd{color:var(--ok-fg);font-weight:700}
.st-bad{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.apr{margin-bottom:18px}
.esttab{min-width:960px}
.itab{min-width:560px}
.itab th{font-size:13px;padding:8px 10px}
.itab td{padding:7px 10px;font-size:14px}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-items:start}
.rack{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:6px;border:3px solid var(--heading);border-radius:6px;padding:6px;background:var(--surface-2)}
.rack .rn{grid-column:1;font-size:10.5px;color:var(--faint);text-align:right;line-height:22px;font-variant-numeric:tabular-nums}
.rack .rs{grid-column:2;border-bottom:1px dashed var(--border)}
.rack .ru{grid-column:2;display:flex;align-items:center;gap:8px;margin:1px 0;padding:0 8px;border-radius:4px;border:1px solid var(--use-bd);background:var(--use-bg);color:var(--use-fg);cursor:pointer;text-align:left;overflow:hidden;font-size:12.5px;z-index:1}
.rack .ru:hover{border-color:var(--accent)}
.rack .ru.man{background:var(--maint-bg);color:var(--maint-fg);border-color:var(--maint-bd)}
.rack .ru svg.i{width:15px;height:15px;flex:none}
.rack .ru b{white-space:nowrap}
.rack .ru span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sisc{margin-bottom:18px}
.sisc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.esttab .esub{display:block;font-weight:600;font-size:12px;color:var(--faint)}
.esttab td.num,.esttab th{text-align:center}
.esttab th:first-child,.esttab td:first-child{text-align:left}
.esttab th{font-size:13.5px;padding:12px 8px;cursor:help}
.esttab td{padding:8px}
.esttab .estmin{width:64px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:center}
.esttab tr.elow td{background:color-mix(in srgb,var(--danger-soft) 55%,transparent)}
.esttab b.neg{color:var(--danger)}
.cdet a{display:inline-flex;align-items:center;gap:6px;color:var(--accent-2);font-weight:700;text-decoration:none}
.cdet a svg.i{width:15px;height:15px}
.cacts{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;align-items:center}
.cacts .linkbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.cacts .linkbtn svg.i{width:16px;height:16px}
.resnote{background:var(--res-bg);color:var(--res-fg);border:1px solid var(--res-bd);border-radius:10px;padding:10px 12px;font-size:14px}
@media (max-width:1100px){.odet{grid-template-columns:1fr}}
@media (max-width:600px){.linkbox{grid-template-columns:1fr}.linkbox .qr{max-width:210px}}
@media (min-width:861px) and (max-height:820px){
  .brand{padding:14px 18px}
  .navlabel{padding:14px 20px 6px}
  .navsep{padding:12px 14px 4px}
  .nav{padding:8px 14px}
  .sync{padding:10px 20px}
}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.photo{max-width:380px;position:static}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{padding:12px 16px;border-bottom:0}
  .logo{width:36px;height:36px}
  .navlabel,.sync,.navsep{display:none}
  nav.menu{flex-direction:row;overflow-x:auto;padding:0 12px 10px;gap:4px}
  .nav{border-left:0;border-bottom:3px solid transparent;border-radius:8px;padding:8px 12px;white-space:nowrap}
  .nav.on{border-bottom-color:var(--accent)}
  .nav .n{display:none}
  main{padding-block:22px 48px}
  .filters{padding:16px}
  .sel{flex:1 1 150px}
  .kv{gap:18px 20px}
  .kv.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:480px){.actions .btn{flex:1 1 auto;justify-content:center}.kv{grid-template-columns:1fr}.bar,.catrow{grid-template-columns:90px minmax(0,1fr) 28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// modo local (quando o banco não está disponível nesta visualização)
const LKEY = "gestao-ativos-local-v1";
const LOCAL_SEED = {items:[],users:[]};
function loadLocal(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
  d = d || JSON.parse(JSON.stringify(LOCAL_SEED));
  S.items=d.items||[]; S.users=d.users||[];
}
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify({items:S.items,users:S.users})); }catch(e){} }

const store = {
  async put(col, id, data){
    if (sb){
      id = id || newId();
      if (col==="ativos"){ const row=itemToRow(data); row.id=id; const {error}=await sb.from("ativos").upsert(row); if(error) throw error; }
      else { const {error}=await sb.from("usuarios").upsert({id, login:data.login, nome:data.nome||"", setor:data.setor||"", email:data.email||""}); if(error) throw error; }
      await sbLoad(col); return id;
    }
    if (cap.db){
      const ref = id ? cap.db.collection(col).doc(id) : cap.db.collection(col).doc();
      await ref.set(data); return ref.id;
    }
    const arr = col==="ativos" ? S.items : S.users;
    id = id || (col[0]+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const i = arr.findIndex(x=>x.id===id); const row = {...data, id};
    if (i>=0) arr[i]=row; else arr.push(row);
    saveLocal(); refresh(); return id;
  },
  async del(col, id){
    if (sb){ const {error}=await sb.from(col).delete().eq("id",id); if(error) throw error; await sbLoad(col); return; }
    if (cap.db){ await cap.db.collection(col).doc(id).delete(); return; }
    const arr = col==="ativos" ? S.items : S.users;
    const i = arr.findIndex(x=>x.id===id); if (i>=0) arr.splice(i,1);
    saveLocal(); refresh();
  }
};
function writeErr(e){
  if (e && (e.code==="42501" || /row-level security|permission denied/i.test(e.message||""))){ toast("Seu acesso é somente leitura."); console.error(e); return; }
  if (e && e.code==="23505"){ toast("Já existe um registro com esse código ou login."); console.error(e); return; }
  if (e && e.code==="invalid_argument"){ S.canWrite=false; toast("Você tem acesso somente leitura a este sistema."); }
  else if (e && e.code==="quota_exceeded") toast("Limite de armazenamento atingido. Exclua registros antigos.");
  else toast("Não foi possível salvar. Tente novamente.");
  console.error(e);
}

async function initCaps(){
  const use = window.claude && window.claude.use;
  if (!use && CFG.supabaseUrl && window.supabase){ return initSupabase(); }
  if (!use){ goLocal(); return; }
  try{
    const [db, assets, downloads] = await Promise.all([window.claude.use("db"), window.claude.use("assets"), window.claude.use("downloads")]);
    cap.db=db; cap.assets=assets; cap.downloads=downloads;
  }catch(e){}
  if (!cap.db){ goLocal(); return; }
  S.mode="db";
  setSync("ok","Dados sincronizados para toda a equipe");
  let got=0;
  const done=()=>{ if(++got>=2 && !S.ready){ S.ready=true; render(); openFromHash(); } };
  cap.db.doc("inventario/atual").onSnapshot(snap=>{ INV = snap.exists ? {...snap.data()} : null; if(S.ready && S.view==="inventario") updateInv(); }, e=>console.error(e));
  cap.db.collection("ativos").onSnapshot(snap=>{
    S.items = snap.docs.map(d=>({...d.data(), id:d.id})); done(); if(S.ready) refresh();
  }, e=>{ console.error(e); setSync("","Conexão com o banco interrompida. Recarregue a página."); });
  cap.db.collection("usuarios").onSnapshot(snap=>{
    S.users = snap.docs.map(d=>({...d.data(), id:d.id})); done(); if(S.ready) refresh();
  }, e=>console.error(e));
}

// ---------- Supabase (app instalável / web) ----------
const CFG = window.GA_CONFIG || {};
let sb = null, SB_USER = null, SB_ROLE = null, sbChannel = null;
const COLS = ["id","tipo","dispositivo","status","usuario","setor","unidade","fabricante","modelo","serie","obs","foto"];
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function rowToItem(r){ const {specs,criado_em,atualizado_em,...rest}=r; return {...(specs||{}), ...rest, criadoEm:criado_em, atualizadoEm:atualizado_em}; }
function itemToRow(d){ const row={specs:{}}; for(const [k,v] of Object.entries(d)){ if(k==="criadoEm"||k==="atualizadoEm"||v===undefined) continue; if(COLS.includes(k)) row[k]=v??""; else row.specs[k]=v; } return row; }
async function sbLoad(which){
  const jobs=[], inv=!SO_ONB();   // RH e aprovador só enxergam o onboarding
  if((!which||which==="onb")) jobs.push(onbLoad());
  if((!which||which==="onbcfg")) jobs.push(onbLoadCfg());
  if(!inv){ await Promise.all(jobs); if(S.ready) refresh(); return; }
  if(!which||which==="infra") jobs.push(infraLoad());
  if(!which||which==="estmin") jobs.push(sb.from("estoque_minimos").select("*").then(({data,error})=>{ if(!error) S.estMin=data||[]; }));
  if(!which||which==="ativos") jobs.push(sb.from("ativos").select("*").then(({data,error})=>{ if(!error) S.items=(data||[]).map(rowToItem); }));
  if(!which||which==="usuarios") jobs.push(sb.from("usuarios").select("*").then(({data,error})=>{ if(!error) S.users=data||[]; }));
  if(!which||which==="termos") jobs.push(sb.from("termos").select(TCOLS).order("criado_em",{ascending:false}).then(({data,error})=>{ if(!error) termosChegaram(data||[]); }));
  if(!which||which==="inventario") jobs.push(sb.from("inventario").select("*").eq("id","atual").maybeSingle().then(({data,error})=>{ if(!error) INV=data?{inicio:data.inicio,encontrados:data.encontrados||{},extras:data.extras||[]}:null; }));
  await Promise.all(jobs);
  if (S.ready) refresh();
}
const _deb={}; const sbDeb = t => { clearTimeout(_deb[t]); _deb[t]=setTimeout(()=>{ if(t==="onbev"){ if(OB.sel) onbLoadEv(OB.sel).then(onbRedetalhe); } else sbLoad(t); },250); };
async function initSupabase(){
  S.mode="sb";
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev, session)=>{
    if (ev==="PASSWORD_RECOVERY") gate("nova");
    else if (ev==="SIGNED_OUT"){ SB_USER=null; S.ready=false; if(sbChannel){ sb.removeChannel(sbChannel); sbChannel=null; } gate("entrar"); }
  });
  const {data:{session}} = await sb.auth.getSession();
  if (/type=recovery/.test(location.hash)) return;   // onAuthStateChange abre a troca de senha
  if (!session) return gate("entrar");

      .on("postgres_changes",{event:"*",schema:"public",table:"onboarding_compras"},()=>sbDeb("onb"))
      .on("postgres_changes",{event:"*",schema:"public",table:"estoque_minimos"},()=>sbDeb("estmin"))
      .on("postgres_changes",{event:"*",schema:"public",table:"infra_racks"},()=>sbDeb("infra"))
      .on("postgres_changes",{event:"*",schema:"public",table:"infra_conexoes"},()=>sbDeb("infra"))

    <button class="btn primary" id="gBtn">Criar acesso</button></form><div class="links"><button class="linkbtn" data-act="g-entrar">Já tenho senha</button></div>`;
  else if (mode==="esqueci") body=`<h2>Redefinir senha</h2><p>Enviaremos um link para o seu e-mail.</p>

  else if (mode==="nova") body=`<h2>Nova senha</h2><p>Digite a nova senha da sua conta.</p>
    <form id="gForm" data-mode="nova" class="opt"><label class="fld"><span>Nova senha (mínimo 8 caracteres)</span><input id="g_pass" type="password" required minlength="8" autocomplete="new-password"></label>${note}
    <button class="btn primary" id="gBtn">Salvar senha</button></form>`;
  else if (mode==="negado") body=`<h2>Acesso não liberado</h2><p>O e-mail <b>${esc(SB_USER?.email||"")}</b> entrou, mas ainda não tem permissão no sistema. Peça a um administrador da TI para liberar o acesso.</p>
    <button class="btn" data-act="logout">Sair e usar outro e-mail</button>`;

  const f=g.querySelector("input"); if(f) setTimeout(()=>f.focus(),30);

function closeGate(){ const g=document.getElementById("gate"); if(g) g.remove(); }
async function gateSubmit(form){
  const mode=form.dataset.mode, btn=document.getElementById("gBtn"); btn.disabled=true;
  const email=(document.getElementById("g_email")?.value||"").trim().toLowerCase(), pass=document.getElementById("g_pass")?.value||"";
  try{
    if (mode==="entrar"){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) return gate("entrar",{t: /confirm/i.test(error.message)?"Confirme seu e-mail pelo link que enviamos antes de entrar.":"E-mail ou senha incorretos."});
      return startSession(data.session);
    }
    if (mode==="criar"){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:redirectUrl()}});
      if(error) return gate("criar",{t: /registered|exists/i.test(error.message)?"Esse e-mail já tem acesso. Use “Já tenho senha” ou “Esqueci a senha”.":"Não foi possível criar o acesso: "+error.message});
      if (data.session) return startSession(data.session);
      return gate("entrar",{ok:true,t:"Enviamos um e-mail de confirmação. Clique no link e depois entre com sua senha."});
    }
    if (mode==="esqueci"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl()});
      return gate("entrar", error?{t:"Não foi possível enviar o link. Tente de novo em alguns minutos."}:{ok:true,t:"Se o e-mail estiver cadastrado, o link chega em instantes."});
    }
    if (mode==="nova"){
      const {error}=await sb.auth.updateUser({password:pass});
      if(error) return gate("nova",{t:"Não foi possível salvar a senha: "+error.message});
      history.replaceState(null,"",location.pathname);
      const {data:{session}}=await sb.auth.getSession(); return startSession(session);
    }
  }catch(e){ console.error(e); gate(mode,{t:"Sem conexão com o servidor. Verifique a internet."}); }
}

// ---------- foto ----------
function resize(file, max, q){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>res({blob:b,dataUrl:c.toDataURL("image/jpeg",q)}),"image/jpeg",q); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();}; img.src=url;
  });
}
document.getElementById("photoFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const big=await resize(f,1200,.85), small=await resize(f,520,.72);
    pendingPhoto={blob:big.blob, small:small.dataUrl};
    const p=document.getElementById("prev"); if(p) p.innerHTML=`<img src="${small.dataUrl}" alt="">`;
  }catch(err){ toast("Não foi possível ler essa imagem. Use JPG ou PNG."); }
});

function exportExcel(){
  const t=S.view, T=TYPES[t]; const rows=filtered(t);
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  const fs=fieldsOf(t);
  const data=rows.map(x=>Object.fromEntries(fs.map(f=>[f.l, x[f.k]||""])));
  const ws=XLSX.utils.json_to_sheet(data,{header:fs.map(f=>f.l)});
  ws["!cols"]=fs.map(f=>({wch:Math.max(12,f.l.length+2)}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,T.label);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const name=`${T.label.toLowerCase()}_${new Date().toISOString().slice(0,10)}.xlsx`;
  saveFile(name, new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})).then(ok=>{ if(ok) toast(`${rows.length} registros exportados.`); });
}
document.getElementById("importFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
    const t=S.view; const fs=fieldsOf(t); const map={};
    fs.forEach(fl=>{ map[norm(fl.l)]=fl.k; map[norm(fl.k)]=fl.k; });
    Object.assign(map,{dispositivo:"dispositivo",nome:"dispositivo",hostname:"dispositivo",marca:"fabricante",memoria:"ram",memoriaram:"ram",so:"so",observacao:"obs",obs:"obs",numerodeserie:"serie",serial:"serie",sistema:"so",bateria:"bateria"});
    const headers=raw.length?Object.keys(raw[0]):[];
    const recognized=headers.filter(h=>map[norm(h)]);
    const rows=raw.map(r=>{ const o={tipo:t}; headers.forEach(h=>{ const k=map[norm(h)]; if(k) o[k]=String(r[h]??"").trim(); });
      if(o.dispositivo) o.dispositivo=o.dispositivo.toUpperCase();
      if(o.status){ const s=STATUS.find(s=>norm(s)===norm(o.status)); if(s) o.status=s; }
      return o; }).filter(o=>o.dispositivo);
    const upd=rows.filter(r=>byType(t).some(i=>norm(i.dispositivo)===norm(r.dispositivo))).length;
    importRows=rows;
    const T=TYPES[t];
    openModal(`<h2>Importar ${T.label.toLowerCase()}</h2><div class="msg">
      ${rows.length?`<p>A planilha <b>${esc(f.name)}</b> tem <b>${rows.length}</b> linhas válidas: <b>${rows.length-upd}</b> novos ${T.label.toLowerCase()} e <b>${upd}</b> atualizações de dispositivos que já existem.</p>
      <p class="note">Colunas reconhecidas: <span class="hdrs">${recognized.map(esc).join(", ")}</span>${headers.length>recognized.length?`<br>Ignoradas: <span class="hdrs">${headers.filter(h=>!map[norm(h)]).map(esc).join(", ")}</span>`:""}</p>`
      :`<p>Nenhuma linha com a coluna <b>Dispositivo</b> (ou <b>Nome do Dispositivo</b>) foi encontrada em <b>${esc(f.name)}</b>.</p><p class="note">Dica: exporte a lista atual para obter uma planilha modelo com os cabeçalhos certos.</p>`}
    </div><div class="foot"><button class="btn ghost" data-act="close">Cancelar</button>${rows.length?`<button class="btn primary" data-act="doimport" id="impBtn">${ICON("up")}Importar ${rows.length} registros</button>`:""}</div>`,"sm");
  }catch(err){ console.error(err); toast("Não foi possível ler a planilha. Use .xlsx, .xls ou .csv."); }
});
async function doImport(){
  const rows=importRows; if(!rows) return; const btn=document.getElementById("impBtn"); btn.disabled=true;
  let ok=0; const now=new Date().toISOString();
  try{
    for(const r of rows){
      const ex=S.items.find(i=>i.tipo===r.tipo && norm(i.dispositivo)===norm(r.dispositivo));
      const data=ex?{...ex,...r,atualizadoEm:now}:{status:"Disponível",...r,criadoEm:now,atualizadoEm:now};
      delete data.id;
      await store.put("ativos", ex?ex.id:null, data); ok++;
      btn.textContent=`Importando ${ok}/${rows.length}…`;
    }
    closeModal(); toast(`${ok} registros importados.`);
  }catch(e){ writeErr(e); closeModal(); if(ok) toast(`${ok} de ${rows.length} registros importados antes do erro.`); }
}

document.getElementById("importUsers").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
    const map={login:"login",usuario:"login",user:"login",username:"login",nomedeusuario:"login",
      nome:"nome",nomecompleto:"nome",colaborador:"nome",funcionario:"nome",
      setor:"setor",departamento:"setor",area:"setor",
      email:"email",emailcorporativo:"email"};
    const headers=raw.length?Object.keys(raw[0]):[];
    const recognized=headers.filter(h=>map[norm(h)]);
    const seen=new Map();
    raw.forEach(r=>{
      const o={}; headers.forEach(h=>{ const k=map[norm(h)]; if(k && !o[k]) o[k]=String(r[h]??"").trim(); });
      if(!o.login && o.email && o.email.includes("@")) o.login=o.email.split("@")[0];
      if(!o.login) return;
      o.login=o.login.toLowerCase().replace(/\s+/g,"");

      seen.set(norm(o.login), {...(seen.get(norm(o.login))||{}), ...Object.fromEntries(Object.entries(o).filter(([,v])=>v))});
    });
    const rows=[...seen.values()];
    const upd=rows.filter(r=>S.users.some(u=>norm(u.login)===norm(r.login))).length;
    importUserRows=rows;
    openModal(`<h2>Importar usuários</h2><div class="msg">

async function doImportUsers(){
  const rows=importUserRows; if(!rows) return; const btn=document.getElementById("uimpBtn"); btn.disabled=true; btn.textContent="Importando…";
  const merged=rows.map(r=>{ const ex=S.users.find(u=>norm(u.login)===norm(r.login));
    return {id:ex?ex.id:null, login:r.login, nome:r.nome||ex?.nome||"", setor:r.setor||ex?.setor||"", email:r.email||ex?.email||""}; });
  try{
    if (sb){
      for(let i=0;i<merged.length;i+=500){
        const chunk=merged.slice(i,i+500).map(r=>({...r,id:r.id||newId()}));
        const {error}=await sb.from("usuarios").upsert(chunk); if(error) throw error;
      }
      await sbLoad("usuarios");
    } else {
      let n=0; for(const r of merged){ const {id,...d}=r; await store.put("usuarios",id,d); btn.textContent=`Importando ${++n}/${merged.length}…`; }
    }
    closeModal(); toast(`${merged.length} usuários importados.`);
  }catch(e){ writeErr(e); closeModal(); }
}

const TCOLS="id,token,ativo_id,tipo,dispositivo,marca,modelo,serie,condicao,obs,usuario_login,colaborador_nome,colaborador_email,cargo,telefone,entregue_por_nome,entregue_por_email,status,criado_em,expira_em,assinado_em,ip,hash,devolvido_em,devolvido_por,devolucao_obs,cancelado_em,origem,arquivo,arquivo_nome,onboarding_id,itens";
const TSTAT={pendente:["Pendente","st-man"],expirado:["Link expirado","st-desc"],assinado:["Assinado","st-disp"],devolvido:["Devolvido","st-uso"],cancelado:["Cancelado","st-desc"]};
const TF={q:"",st:"",or:""};
const tStatus=t=> t.status==="pendente" && new Date(t.expira_em)<new Date() ? "expirado" : t.status;
const tPill=t=>{ const [l,c]=TSTAT[tStatus(t)]||[t.status,"st-desc"]; return `<span class="pill ${c}">${l}</span>`; };
const tUrl=t=>`${APP_URL}assinar.html#${t.token}`;
const fData=iso=>iso?new Date(iso).toLocaleDateString("pt-BR"):"";
const fDH=iso=>iso?new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.-]+/g,"_").replace(/^_+|_+$/g,"");
function meuNome(){
  const em=String(SB_USER&&SB_USER.email||"").toLowerCase();
  const u=S.users.find(u=>String(u.email||"").toLowerCase()===em); if(u&&u.nome) return u.nome;
  return (em.split("@")[0]||"").split(/[._-]/).filter(Boolean).map(p=>p[0].toUpperCase()+p.slice(1)).join(" ");
}
function termosChegaram(novos){
  const antes=new Map(S.termos.map(t=>[t.id,t.status]));
  S.termos=novos;

  novos.filter(t=>t.status==="assinado" && antes.get(t.id)==="pendente").forEach(t=>{

function tActions(t){
  const st=tStatus(t), b=(act,ic,lab)=>`<button class="ib" data-act="${act}" data-id="${t.id}" title="${lab}" aria-label="${lab}">${ICON(ic)}</button>`;
  const w=S.canWrite, del=SB_ROLE==="admin"?`<button class="ib del" data-act="tdel" data-id="${t.id}" title="Excluir termo" aria-label="Excluir termo">${ICON("trash")}</button>`:"";
  if(t.origem==="papel"){ const f=b("tfile","down","Baixar termo digitalizado"); return st==="assinado"?f+(w?b("tdev","undo","Registrar devolução"):"")+del:f+del; }
  if(st==="pendente"||st==="expirado") return b("tlink","link","Link de assinatura")+(w?b("tcancel","x","Cancelar termo"):"")+del;
  if(st==="assinado") return b("tpdf","down","Exportar PDF")+(w?b("tdev","undo","Registrar devolução"):"")+del;
  if(st==="devolvido") return b("tpdf","down","Exportar PDF")+del;

}
function tQuando(t){
  const st=tStatus(t);

  if(st==="cancelado") return `cancelado em ${fData(t.cancelado_em)}`;

  return `gerado em ${fData(t.criado_em)}`;
}

async function termoPDF(id){

let IMPT=[], IMPT_ATIVO=null;
const MIME={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png"};
async function sha256Hex(buf){ try{ return [...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){ return ""; } }
function ativoPorCodigo(txt){
  const c=String(txt||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(!c) return null;
  const m=c.match(/^([A-Z]+)0*(\d+)$/);
  return S.items.find(i=>{ const d=String(i.dispositivo||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(d===c) return true;
    const mm=d.match(/^([A-Z]+)0*(\d+)$/); return !!(m&&mm&&m[1]===mm[1]&&+m[2]===+mm[2]); })||null;
}
function ativoPeloArquivo(nome){
  const base=nome.replace(/\.[^.]+$/,"").toUpperCase();
  const prefs=[...new Set([...Object.values(TYPES).map(t=>t.prefix),...S.items.map(i=>(String(i.dispositivo||"").toUpperCase().match(/^[A-Z]+/)||[""])[0]).filter(Boolean)])].join("|");
  const re=new RegExp(`(${prefs})[\\s_.-]*(\\d{1,6})`,"g"); let m;
  while((m=re.exec(base))){ const x=ativoPorCodigo(m[1]+m[2]); if(x) return x; }
  return null;
}
function loginPeloArquivo(nome, x){
  const n=norm(nome);
  const u=S.users.filter(u=>u.login && norm(u.login).length>=4 && n.includes(norm(u.login))).sort((a,b)=>b.login.length-a.login.length)[0];
  return u?u.login:((x&&x.usuario)||"");
}
function dataPeloArquivo(f){
  const n=f.name; let m;
  if((m=n.match(/(20\d{2})[-_.](\d{2})[-_.](\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=n.match(/(\d{2})[-_.](\d{2})[-_.](20\d{2})/))) return `${m[3]}-${m[2]}-${m[1]}`;
  const d=new Date(f.lastModified||Date.now()); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function abrirImportTermos(ativoId){ IMPT_ATIVO=ativoId||null; const i=document.getElementById("importTermos"); i.multiple=!ativoId; i.click(); }
document.getElementById("importTermos").addEventListener("change", e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  const fixo=IMPT_ATIVO?S.items.find(i=>i.id===IMPT_ATIVO):null;
  IMPT=files.map(f=>{ const ext=(f.name.split(".").pop()||"").toLowerCase(); const x=fixo||ativoPeloArquivo(f.name);
    const erro=!MIME[ext]?"Formato não aceito (use PDF, JPG ou PNG)":f.size>20*1024*1024?"Arquivo maior que 20 MB":"";
    return {f,ext,x,cod:x?x.dispositivo:"",login:loginPeloArquivo(f.name,x),data:dataPeloArquivo(f),inc:!erro&&!!x,erro,st:"",ok:false}; });
  renderImportTermos();
});
function impAviso(r){
  if(r.erro) return r.erro;
  if(!r.x) return "Informe o patrimônio";
  if(!r.login) return "Informe o colaborador";
  const ja=S.termos.find(t=>t.ativo_id===r.x.id && t.status==="assinado" && norm(t.usuario_login)===norm(r.login));
  return ja?"Já existe termo assinado deste colaborador":"";
}
function renderImportTermos(){
  const ok=IMPT.filter(r=>r.x).length;
  openModal(`<h2>Importar termos digitalizados</h2><div class="msg">
    <p>${IMPT.length} ${IMPT.length>1?"arquivos selecionados":"arquivo selecionado"}: ${ok} com patrimônio reconhecido. Confira o patrimônio, o colaborador e a data em que o termo foi assinado.</p>
    <datalist id="dl-ativos">${S.items.map(i=>`<option value="${esc(i.dispositivo)}">${esc([TYPES[i.tipo]?.one,i.usuario].filter(Boolean).join(" · "))}</option>`).join("")}</datalist>
    <datalist id="dl-usuarios">${S.users.map(u=>`<option value="${esc(u.login)}">${esc(u.nome||"")}</option>`).join("")}</datalist>
    <div class="tablewrap" style="border:1px solid var(--border);border-radius:12px"><table class="imptab"><thead><tr><th></th><th>Arquivo</th><th>Patrimônio</th><th>Colaborador (login)</th><th>Assinado em</th><th>Situação</th></tr></thead><tbody id="imptb"></tbody></table></div>
    <p class="note" style="margin-top:12px">Dica: nomeie os arquivos com o patrimônio, como <b>LAP066.pdf</b> ou <b>LAP066 - ketlyn.santos - 2025-03-10.pdf</b>, e o sistema preenche tudo sozinho.</p>

function updateImportTermos(){
  const tb=document.getElementById("imptb"); if(!tb) return;
  tb.innerHTML=IMPT.map((r,i)=>{ const av=r.st||impAviso(r); const cls=r.ok?"ok":(r.st||(!r.x||r.erro||!r.login))?"err":"";

    <td><input type="text" class="implog ${r.login?"":"bad"}" data-i="${i}" list="dl-usuarios" value="${esc(r.login)}" ${r.ok?"disabled":""}></td>

    <td class="st ${cls}">${esc(r.ok?"✓ Anexado":av||"Pronto")}</td></tr>`; }).join("");
  const n=IMPT.filter(r=>r.inc&&!r.ok).length, b=document.getElementById("impTBtn");
  if(b){ b.disabled=!n; b.innerHTML=`${ICON("up")}Anexar ${n} ${n===1?"termo":"termos"}`; }

function impCampo(el){
  const r=IMPT[+el.dataset.i]; if(!r) return;
  if(el.classList.contains("impcod")){ r.cod=el.value; r.x=ativoPorCodigo(el.value); if(r.x && !r.login) r.login=r.x.usuario||""; if(r.x&&!r.erro) r.inc=true; el.classList.toggle("bad",!r.x);
    const lg=el.closest("tr").querySelector(".implog"); if(lg && !lg.value && r.login){ lg.value=r.login; lg.classList.remove("bad"); } }
  if(el.classList.contains("implog")){ r.login=el.value.trim().toLowerCase(); el.classList.toggle("bad",!r.login); }
  if(el.classList.contains("impdt")) r.data=el.value;
  if(el.classList.contains("impinc")) r.inc=el.checked;
  r.st=""; const st=el.closest("tr").querySelector(".st"); const av=impAviso(r);
  st.textContent=av||"Pronto"; st.className="st "+((!r.x||r.erro||!r.login)?"err":"");
  const n=IMPT.filter(r=>r.inc&&!r.ok).length, b=document.getElementById("impTBtn");
  if(b){ b.disabled=!n; b.innerHTML=`${ICON("up")}Anexar ${n} ${n===1?"termo":"termos"}`; }
}
async function doImportTermos(){
  const b=document.getElementById("impTBtn"); const fila=IMPT.filter(r=>r.inc&&!r.ok);
  if(fila.some(r=>!r.x||!r.login||!r.data)){ fila.forEach(r=>{ if(!r.x||!r.login||!r.data) r.st=!r.x?"Informe o patrimônio":!r.login?"Informe o colaborador":"Informe a data"; }); updateImportTermos(); toast("Complete as linhas destacadas ou desmarque-as."); return; }
  b.disabled=true; let n=0, falhas=0;
  for(const r of fila){
    b.textContent=`Anexando ${++n}/${fila.length}…`;
    try{
      const path=`${r.x.id}/${newId()}.${r.ext}`;
      const hash=await sha256Hex(await r.f.arrayBuffer());
      const up=await sb.storage.from("termos").upload(path,r.f,{contentType:MIME[r.ext],upsert:false}); if(up.error) throw up.error;
      const u=S.users.find(u=>norm(u.login)===norm(r.login))||{};
      const {error}=await sb.from("termos").insert({origem:"papel",ativo_id:r.x.id,tipo:r.x.tipo,dispositivo:r.x.dispositivo,marca:r.x.fabricante||"",modelo:r.x.modelo||"",serie:r.x.serie||"",
        usuario_login:r.login,colaborador_nome:u.nome||"",colaborador_email:u.email||"",assinado_em:`${r.data}T12:00:00-03:00`,
        arquivo:path,arquivo_nome:r.f.name,arquivo_hash:hash,obs:"Termo em papel digitalizado",entregue_por_nome:""});
      if(error) throw error;
      r.ok=true; r.inc=false; r.st="";
    }catch(e){ console.error(e); falhas++; r.st="Erro: "+((e&&e.message)||"não foi possível enviar"); }
    updateImportTermos();
  }
  await sbLoad("termos");
  const okn=fila.filter(r=>r.ok).length;
  if(!falhas){ closeModal(); toast(`${okn} ${okn===1?"termo anexado":"termos anexados"}.`); }
  else { updateImportTermos(); toast(`${okn} anexados, ${falhas} com erro. Veja a coluna Situação.`); }
}
async function termoArquivo(id){
  const t=S.termos.find(t=>t.id===id); if(!t||!t.arquivo) return;

  const name=`termo_${slug(t.dispositivo)}_${slug(t.colaborador_nome||t.usuario_login)}_${String(t.assinado_em||"").slice(0,10)}.${ext}`;
  saveFile(name,data).then(ok=>{ if(ok) toast("Arquivo baixado."); });
}

const OST = {
  solicitado:["Solicitado","st-sol"], em_analise:["Em análise pela TI","st-uso"], aguardando_equipamentos:["Aguardando equipamentos","st-man"],
  em_preparacao:["Em preparação","st-prep"], aguardando_entrega:["Aguardando entrega","st-res"], entregue:["Entregue / Aguardando aceite","st-ent"],
  concluido:["Concluído","st-ok"], cancelado:["Cancelado","st-desc"] };
const OST_ABERTOS = ["solicitado","em_analise","aguardando_equipamentos","em_preparacao","aguardando_entrega"];
const OGRP = {acessos:"Conta e acessos", equipamentos:"Equipamentos", entrega:"Entrega"};
const OB = {q:"", st:"abertos", dep:"", uni:"", de:"", ate:"", sol:"", tec:"", sel:null, ev:[], evFor:null, cpf:null, cpfFor:null, cpfShow:false};
let OBP = null;       // seletor de ativo aberto
let OIMP = null;      // importação do formulário
const isTI = () => SB_ROLE==="admin" || SB_ROLE==="editor";
const isRH = () => SB_ROLE==="rh";
const podeAprovar = () => SB_ROLE==="admin" || SB_ROLE==="aprovador";
const SO_ONB = () => SB_ROLE==="rh" || SB_ROLE==="aprovador";          // perfis sem acesso ao inventário
const viewsPermitidas = () => SB_ROLE==="aprovador" ? ["aprovacoes","onboarding"] : SB_ROLE==="rh" ? ["onboarding"] : null;
const podeSolicitar = () => ["admin","editor","rh"].includes(SB_ROLE);
const veCPF = () => SB_ROLE==="rh" || SB_ROLE==="admin";
const oPill = o => { const [l,c]=OST[o.status]||[o.status,"st-desc"]; return `<span class="pill ${c}">${esc(l)}</span>`; };
const hojeISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dISO = s => { if(!s) return null; const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const diasAte = s => { const a=dISO(s); return a ? Math.round((a-dISO(hojeISO()))/864e5) : null; };
const fDia = s => s ? String(s).slice(0,10).split("-").reverse().join("/") : "";
const oLinks = id => S.onbAtivos.filter(l=>l.onboarding_id===id && !l.removido);
const oCheck = id => S.onbCheck.filter(c=>c.onboarding_id===id && !c.removido).sort((a,b)=>a.ordem-b.ordem||a.id-b.id);
const oPct = id => { const c=oCheck(id); return c.length ? Math.round(c.filter(x=>x.feito).length/c.length*100) : 0; };
const opcEquip = p => S.onbOpc.find(x=>x.grupo==="equipamento" && norm(x.nome)===norm(p));
const tipoUm = t => (TYPES[t]&&TYPES[t].one) || (window.TERMO&&TERMO.TIPOS[t]) || t || "Ativo";
function nomeDe(em){
  if(!em) return "—"; if(!String(em).includes("@")) return em;
  const u=S.users.find(u=>String(u.email||"").toLowerCase()===String(em).toLowerCase()); if(u&&u.nome) return u.nome;
  return (String(em).split("@")[0]||"").split(/[._-]/).filter(Boolean).map(p=>p[0].toUpperCase()+p.slice(1)).join(" ");
}
const unidades = () => [...new Set([...S.onbOpc.filter(x=>x.grupo==="unidade"&&x.ativo).map(x=>x.nome), ...S.items.map(x=>x.unidade), ...S.onb.map(o=>o.unidade)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
const deptos = () => [...new Set([...setores(), ...S.onb.map(o=>o.departamento)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
function sugLogin(o){
  if(o.login) return o.login;
  const em=String(o.email_corporativo||""); if(em.includes("@")) return em.split("@")[0].toLowerCase();
  const p=String(o.nome||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(Boolean);
  return p.length>1 ? `${p[0]}.${p[p.length-1]}` : (p[0]||"");
}

// pedidos de equipamento x ativos vinculados (para "x/y preparados")
function casar(o){
  const L=oLinks(o.id), usados=new Set();
  const ped=[...(o.equipamentos||[]).map(p=>({p, op:opcEquip(p), links:[]})), ...(o.equipamentos_outros?[{p:o.equipamentos_outros, outro:true, links:[]}]:[])];
  ped.forEach(r=>{ r.links=L.filter(l=>!usados.has(l.id) && l.item_solicitado && norm(l.item_solicitado)===norm(r.p)); r.links.forEach(l=>usados.add(l.id)); });
  ped.forEach(r=>{ if(r.links.length||!r.op||!r.op.tipo_ativo) return;
    const l=L.find(l=>!usados.has(l.id) && l.tipo===r.op.tipo_ativo && (!r.op.subtipo || norm(l.descricao).startsWith(norm(r.op.subtipo))));
    if(l){ r.links=[l]; usados.add(l.id); } });
  ped.forEach(r=>{ if(r.outro && !r.links.length){ const l=L.find(l=>!usados.has(l.id)); if(l){ r.links=[l]; usados.add(l.id); } } });
  ped.forEach(r=>{ if(!r.links.length) r.compra=oCompras(o.id).find(c=>CABERTAS.includes(c.status)&&norm(c.item)===norm(r.p)); });
  return {ped, extras:L.filter(l=>!usados.has(l.id))};
}
function oPrazo(o){
  if(o.status==="concluido") return {t:`Concluído em ${fData(o.concluido_em)}`, c:"ok"};
  if(o.status==="cancelado") return {t:"Cancelado", c:""};
  if(o.status==="entregue") return {t:`Entregue em ${fData(o.entregue_em)}`, c:"ok"};
  const d=diasAte(o.data_admissao); if(d==null) return {t:"Sem data", c:""};
  if(d<0) return {t:`Atrasado ${-d} ${-d===1?"dia":"dias"}`, c:"late"};
  if(d===0) return {t:"Admissão hoje", c:"soon"};
  if(d===1) return {t:"Amanhã", c:"soon"};
  return {t:`Em ${d} dias`, c:d<=3?"soon":""};
}
function oAlertas(){
  const out=[], agora=Date.now();
  S.onb.forEach(o=>{
    if(OST_ABERTOS.includes(o.status)){
      const d=diasAte(o.data_admissao);
      if(d!=null && d<0) out.push({o,n:0,c:"late",t:`Atrasado: admissão foi em ${fDia(o.data_admissao)} e a entrega não foi registrada`});
      else if(d!=null && d<=1) out.push({o,n:1,c:"soon",t:d===0?"Admissão hoje":"Admissão amanhã"});
      else if(d!=null && d<=3) out.push({o,n:2,c:"soon",t:`Admissão em ${d} dias (${fDia(o.data_admissao)})`});
      const h=(agora-new Date(o.solicitado_em))/36e5;
      if(!o.responsavel_ti && h>24) out.push({o,n:3,c:"warn",t:`Sem responsável da TI há ${Math.floor(h/24)} ${Math.floor(h/24)===1?"dia":"dias"}`});
    } else if(o.status==="entregue" && o.entregue_em && agora-new Date(o.entregue_em)>2*864e5)
      out.push({o,n:4,c:"warn",t:"Entregue há mais de 2 dias, aguardando aceite do termo"});
    compraAlertas(o, out);
  });
  return out.sort((a,b)=>a.n-b.n || String(a.o.data_admissao||"").localeCompare(String(b.o.data_admissao||"")));
}
function oAlertHTML(lim){
  const al=oAlertas(); if(!al.length) return "";
  const vis=lim?al.slice(0,lim):al;
  return `<div class="panelhead"><h2>Alertas de onboarding (${al.length})</h2>${lim&&al.length>lim?`<button class="linkbtn" data-act="go" data-v="onboarding">Ver todos</button>`:""}</div>
  <div class="list">${vis.map(a=>`<div class="al ${a.c}" data-act="oopen" data-id="${a.o.id}"><i></i><b>${esc(a.o.nome)}</b><span>${esc(a.t)}${a.o.departamento?` · ${esc(a.o.departamento)}`:""}</span>${ICON("eye")}</div>`).join("")}</div>`;
}

// ---------- carga ----------
async function pageAll(build){
  const out=[]; for(let i=0;;i+=1000){ const {data,error}=await build().range(i,i+999); if(error) throw error; out.push(...(data||[])); if(!data||data.length<1000) break; } return out;
}
async function onbLoad(){
  try{
    const [o,a,c,cp]=await Promise.all([
      pageAll(()=>sb.from("onboardings").select("*").order("numero",{ascending:false})),
      pageAll(()=>sb.from("onboarding_ativos").select("*").order("id")),
      pageAll(()=>sb.from("onboarding_checklist").select("*").order("id")),
      pageAll(()=>sb.from("onboarding_compras").select("*").order("id"))]);
    S.onb=o; S.onbAtivos=a; S.onbCheck=c; S.onbCompras=cp;
  }catch(e){ console.error(e); }
}
async function onbLoadCfg(){
  const [p,m]=await Promise.all([sb.from("onboarding_opcoes").select("*").order("grupo").order("ordem").order("id"),
    sb.from("onboarding_checklist_modelo").select("*").order("grupo").order("ordem").order("id")]);
  if(!p.error) S.onbOpc=p.data||[]; if(!m.error) S.onbMod=m.data||[];
  const g=await sb.from("ga_config").select("*"); if(!g.error) S.cfg=Object.fromEntries((g.data||[]).map(r=>[r.chave,r.valor]));
}
async function onbLoadEv(id){
  const {data,error}=await sb.from("onboarding_eventos").select("*").eq("onboarding_id",id).order("em",{ascending:false}).order("id",{ascending:false}).limit(500);
  if(!error){ OB.ev=data||[]; OB.evFor=id; }
}
async function onbLoadCPF(id){
  if(!veCPF()) return;
  const {data}=await sb.from("onboarding_privado").select("cpf").eq("onboarding_id",id).maybeSingle();
  OB.cpf=data?data.cpf||"":""; OB.cpfFor=id;
}
async function onbReload(){ await sbLoad("onb"); if(OB.sel){ await onbLoadEv(OB.sel); onbRedetalhe(); } }
function onbErr(e){
  if(e && e.code==="P0001"){ toast(e.message); console.error(e); return; }
  writeErr(e);
}
async function onbUpd(id, patch, msg){
  const {data,error}=await sb.from("onboardings").update(patch).eq("id",id).select("id");
  if(error){ onbErr(error); return false; }
  if(!data||!data.length){ toast("Você não tem permissão para alterar esta solicitação."); return false; }
  await onbReload(); if(msg) toast(msg); return true;
}

const oSolic = o => o.solicitante_nome || nomeDe(o.solicitante_email);
function onbFiltrados(){
  const q=norm(OB.q);
  return S.onb.filter(o=>
    (OB.st==="todos" || (OB.st==="abertos"?OST_ABERTOS.includes(o.status):o.status===OB.st)) &&
    (!OB.dep||o.departamento===OB.dep) && (!OB.uni||o.unidade===OB.uni) &&
    (!OB.sol||(o.solicitante_email||"")===OB.sol) && (!OB.tec||(OB.tec==="-"?!o.responsavel_ti:o.responsavel_ti===OB.tec)) &&
    (!OB.de||(o.data_admissao&&o.data_admissao>=OB.de)) && (!OB.ate||(o.data_admissao&&o.data_admissao<=OB.ate)) &&
    (!q||[o.nome,o.cargo,o.email_corporativo,o.departamento,o.login,"#"+o.numero,String(o.numero)].some(v=>norm(v).includes(q))))
  .sort((a,b)=>{ const fa=OST_ABERTOS.includes(a.status)?0:1, fb=OST_ABERTOS.includes(b.status)?0:1;
    return fa-fb || (fa===0 ? String(a.data_admissao||"9").localeCompare(String(b.data_admissao||"9")) : b.numero-a.numero); });
}

function onbAbrir(id){
  const o=S.onb.find(x=>x.id===id); if(!o) return;
  closeModal();
  OB.sel=id; OB.ev=[]; OB.evFor=null; OB.cpf=null; OB.cpfFor=null; OB.cpfShow=false;
  S.view="onboarding"; render(); window.scrollTo(0,0);
  try{ history.replaceState(null,"",`#onb-${o.numero}`); }catch(e){}
  Promise.all([onbLoadEv(id), onbLoadCPF(id)]).then(()=>{ if(OB.sel===id) onbRedetalhe(); });
}
function onbVoltar(){ OB.sel=null; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} render(); }
function onbRedetalhe(){
  const m=document.getElementById("main"); if(!m||S.view!=="onboarding"||!OB.sel||!S.ready) return;
  const keep={}; m.querySelectorAll("textarea[id],input[id]:not([type=checkbox])").forEach(el=>keep[el.id]=el.value);
  const fid=document.activeElement&&m.contains(document.activeElement)?document.activeElement.id:""; const y=window.scrollY;
  m.innerHTML=onbDetalheHTML();
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  if(fid){ const el=document.getElementById(fid); if(el) el.focus({preventScroll:true}); }
  window.scrollTo(0,y);
}

function cpfValido(c){
  const d=String(c||"").replace(/\D/g,""); if(d.length!==11||/^(\d)\1+$/.test(d)) return false;
  const dv=n=>{ let s=0; for(let i=0;i<n;i++) s+=+d[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r; };
  return dv(9)===+d[9] && dv(10)===+d[10];
}
async function submitOnb(form){
  const fd=new FormData(form), id=form.dataset.id||null, g=k=>String(fd.get(k)||"").trim();
  const row={nome:g("nome").replace(/\s+/g," "),cargo:g("cargo"),departamento:g("departamento"),unidade:g("unidade"),email_corporativo:g("email_corporativo").toLowerCase(),
    telefone:g("telefone"),data_admissao:g("data_admissao")||null,equipamentos:fd.getAll("equipamentos"),equipamentos_outros:g("equipamentos_outros"),
    softwares:fd.getAll("softwares"),softwares_outros:g("softwares_outros"),rede:fd.getAll("rede"),rede_outros:g("rede_outros"),outros:g("outros")};
  if(form.querySelector("[name=login]")) row.login=g("login").toLowerCase();
  const cpf=veCPF()?g("cpf").replace(/\D/g,""):"";
  if(cpf && !cpfValido(cpf)){ toast("O CPF informado não é válido."); form.querySelector("[name=cpf]").focus(); return; }
  const btn=document.getElementById("ofBtn"); btn.disabled=true;
  try{
    let oid=id;
    if(id){ const {data,error}=await sb.from("onboardings").update(row).eq("id",id).select("id"); if(error) throw error; if(!data||!data.length){ toast("Você não tem permissão para editar esta solicitação."); btn.disabled=false; return; } }
    else { oid=newId(); const {error}=await sb.from("onboardings").insert({...row,id:oid,solicitante_nome:meuNome(),origem:"sistema"}); if(error) throw error; }
    if(veCPF() && (cpf || (id && OB.cpfFor===id && OB.cpf))){
      const {error}=await sb.from("onboarding_privado").upsert({onboarding_id:oid,cpf}); if(error) throw error;
      OB.cpf=cpf; OB.cpfFor=oid;
    }
    closeModal(); await sbLoad("onb");
    if(id){ await onbReload(); toast("Solicitação atualizada."); } else { onbAbrir(oid); toast("Solicitação enviada para a TI."); }
  }catch(e){ btn.disabled=false; onbErr(e); }
}

async function onbVincular(aid){
  if(!OBP) return; const {id,pedido}=OBP;
  const ex=S.onbAtivos.find(l=>l.onboarding_id===id&&l.ativo_id===aid);
  const q=ex ? sb.from("onboarding_ativos").update({removido:false,item_solicitado:pedido}).eq("id",ex.id)
             : sb.from("onboarding_ativos").insert({onboarding_id:id,ativo_id:aid,item_solicitado:pedido});
  const {error}=await q; if(error){ onbErr(error); return; }
  const x=S.items.find(i=>i.id===aid); closeModal(); OBP=null;
  await Promise.all([sbLoad("ativos"),onbReload()]); toast(`${x?x.dispositivo:"Ativo"} vinculado e reservado.`);
