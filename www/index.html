function lerData(v){
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v==="number" && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()); }   // número de série do Excel
  const s=String(v||"").trim(); let m;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)); }
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?/))) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return null;
}
const isoDia = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : null;
function mapearColunas(hdr){
  const map=[], usados={}; let ultimo=null;
  hdr.forEach((h,i)=>{ const n=norm(h); let k=null;
    if(/^carimbo|^timestamp|^datahora$/.test(n)) k="carimbo";
    else if(/^nome(do|da)?(funcionario|colaborador|completo)?$/.test(n)||n==="colaborador"||n==="funcionario") k="nome";
    else if(n.startsWith("cargo")||n==="funcao") k="cargo";
    else if(n.startsWith("departamento")||n==="setor"||n==="area") k="departamento";
    else if(n.startsWith("unidade")||n==="filial"||n==="local") k="unidade";
    else if(n.startsWith("emailcorporativo")) k="email_corporativo";
    else if(n.includes("admissao")) k="data_admissao";
    else if(n.startsWith("equipamento")){ k="equipamentos"; }
    else if(n.startsWith("software")||n.startsWith("sistema")){ k="softwares"; }
    else if(n.startsWith("rede")||n.startsWith("compartilhamento")||n.startsWith("acessoarede")){ k="rede"; }
    else if(n.startsWith("outro")) k=(ultimo&&!usados[ultimo+"_outros"])?ultimo+"_outros":"outros";
    else if(n==="enderecodeemail"||n==="email"||n==="emaildosolicitante") k="solicitante";
    else if(n==="cpf"||n.startsWith("cpf")) k="cpf";
    else if(n.startsWith("telefone")||n.startsWith("celular")||n==="whatsapp") k="telefone";
    if(k&&usados[k]&&k!=="outros") k=null;
    if(k){ usados[k]=true; if(["equipamentos","softwares","rede"].includes(k)) ultimo=k; else if(!k.endsWith("_outros")) ultimo=null; }
    map[i]=k; });
  return map;
}
function separarOpcoes(txt, grupo){
  const ops=S.onbOpc.filter(x=>x.grupo===grupo).map(x=>x.nome); const ok=[], resto=[];
  String(txt||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    const op=ops.find(o=>norm(o)===norm(p))||ops.find(o=>norm(p).length>=3&&(norm(o).startsWith(norm(p))||norm(p).startsWith(norm(o))));
    if(op){ if(!ok.includes(op)) ok.push(op); } else resto.push(p.replace(/^outros?:\s*/i,"")); });
  return [ok, resto];
}
document.getElementById("importOnb").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true});
    const hdr=(aoa[0]||[]).map(String), map=mapearColunas(hdr);
    const linhas=aoa.slice(1).filter(r=>r.some(c=>String(c).trim()));
    const rows=linhas.map(r=>{ const o={equipamentos:[],softwares:[],rede:[]}, out={equipamentos:[],softwares:[],rede:[]};
      map.forEach((k,i)=>{ if(!k) return; const v=r[i];
        if(k==="carimbo"){ o.carimbo=lerData(v); return; }
        if(k==="data_admissao"){ o.data_admissao=isoDia(lerData(v)); return; }
        if(["equipamentos","softwares","rede"].includes(k)){ const [ok,resto]=separarOpcoes(v,{equipamentos:"equipamento",softwares:"software",rede:"rede"}[k]); o[k]=ok; out[k]=resto; return; }
        o[k]=String(v instanceof Date?isoDia(v):v).trim(); });
      ["equipamentos","softwares","rede"].forEach(k=>{ const ex=[...out[k], o[k+"_outros"]].filter(Boolean).join(", "); o[k+"_outros"]=ex; });
      o.nome=String(o.nome||"").replace(/\s+/g," ").trim();
      o.ref="form:"+(o.carimbo?o.carimbo.toISOString():"")+"|"+norm(o.nome)+"|"+(o.data_admissao||"");
      o.dup=S.onb.some(x=>x.origem_ref===o.ref) || S.onb.some(x=>norm(x.nome)===norm(o.nome)&&x.data_admissao===o.data_admissao&&x.status!=="cancelado");
      o.erro=!o.nome?"Sem nome":"";
      return o; });
    OIMP={rows, nome:f.name, cpfCol:map.includes("cpf")};
    const rec=hdr.filter((h,i)=>map[i]), ign=hdr.filter((h,i)=>!map[i]&&String(h).trim());
    const novos=rows.filter(r=>!r.dup&&!r.erro);
    openModal(`<h2>Importar respostas do formulário</h2><div class="msg">
      <p>A planilha <b>${esc(f.name)}</b> tem <b>${rows.length}</b> respostas: <b>${novos.length}</b> novas e <b>${rows.length-novos.length}</b> já importadas ou incompletas, que serão ignoradas.</p>
      ${novos.length?`<div class="tablewrap" style="border:1px solid var(--border);border-radius:12px;max-height:300px;overflow:auto"><table style="min-width:640px"><thead><tr><th>Nome</th><th>Cargo</th><th>Departamento</th><th>Admissão</th><th>Equipamentos</th></tr></thead><tbody>
        ${novos.map(r=>`<tr><td class="dev">${esc(r.nome)}</td><td>${esc(r.cargo||"—")}</td><td>${esc(r.departamento||"—")}</td><td>${esc(fDia(r.data_admissao)||"—")}</td><td>${esc([...r.equipamentos,r.equipamentos_outros].filter(Boolean).join(", ")||"—")}</td></tr>`).join("")}</tbody></table></div>`:""}
      <p class="note" style="margin-top:12px">Colunas reconhecidas: <span class="hdrs">${rec.map(esc).join(", ")||"nenhuma"}</span>${ign.length?`<br>Ignoradas: <span class="hdrs">${ign.map(esc).join(", ")}</span>`:""}
      ${OIMP.cpfCol&&!veCPF()?`<br>A coluna CPF não será importada: só o RH e administradores podem gravar CPF.`:""}</p>
    </div><div class="foot"><button class="btn ghost" data-act="close">Cancelar</button>${novos.length?`<button class="btn primary" data-act="doimpo" id="oiBtn">${ICON("up")}Importar ${novos.length} ${novos.length===1?"solicitação":"solicitações"}</button>`:""}</div>`,"md");
  }catch(err){ console.error(err); toast("Não foi possível ler a planilha. Use .xlsx, .xls ou .csv."); }
});

async function onbCfgSalvar(el){

}
async function onbCfgAdd(form){

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){
  const vals=[104]; for(const ch of text){ const c=ch.charCodeAt(0); if(c<32||c>126) throw new Error("Caractere inválido"); vals.push(c-32); }
  let sum=104; for(let i=1;i<vals.length;i++) sum+=vals[i]*i;
  vals.push(sum%103); vals.push(106);
  const bars=[]; let x=0;
  vals.forEach(v=>{ const p=C128[v]; for(let i=0;i<p.length;i++){ const w=+p[i]; if(i%2===0) bars.push([x,w]); x+=w; } });
  return {bars, modules:x};
}
// p = pincel: rect(x,y,w,h), text(str,x,y,sizePt,bold,align,maxW) — coordenadas em mm
function drawLabel(p, o){
  const {W,H,code,qrText,top,bottom} = o;
  const m = Math.max(1.2, H*0.06), hb = H*0.27, gap = H*0.045;
  const topH = H - 2*m - hb - gap - (bottom ? H*0.08 : 0);
  const qr = qrcode(0, "M"); qr.addData(qrText); qr.make();
  const n = qr.getModuleCount(), qs = topH, ms = qs/n;
  for(let r=0;r<n;r++){ let c=0; while(c<n){ if(qr.isDark(r,c)){ let e=c; while(e+1<n && qr.isDark(r,e+1)) e++; p.rect(m+c*ms, m+r*ms, (e-c+1)*ms+0.01, ms+0.01); c=e+1; } else c++; } }
  const tx = m + qs + H*0.07, tw = W - tx - m, pt = mm => mm/0.3528;
  const hTop = top ? topH*0.22 : 0, sp = top ? topH*0.06 : 0;
  if (top) p.text(top, tx, m + hTop*0.82, pt(hTop*0.78), true, "left", tw);
  const codeH = topH - hTop - sp;
  p.text(code, tx, m + hTop + sp + codeH*0.78, pt(Math.min(codeH*0.95, tw/(code.length*0.62))), true, "left", tw);
  const {bars, modules} = code128(code);
  const bw = W - 2*m, xd = bw/(modules+20), by = m + topH + gap;
  bars.forEach(([x,w]) => p.rect(m + (10+x)*xd, by, w*xd, hb));
  if (bottom) p.text(bottom, W/2, H - m*0.75, pt(H*0.075), false, "center", W-2*m);
}
const _mctx = document.createElement("canvas").getContext("2d");
function svgPainter(){
  const out=[];
  return { out,
    rect:(x,y,w,h)=>out.push(`<rect x="${x.toFixed(3)}" y="${y.toFixed(3)}" width="${w.toFixed(3)}" height="${h.toFixed(3)}"/>`),
    text:(s,x,y,size,bold,align,maxW)=>{ let sz=size; const f=z=>{_mctx.font=`${bold?"700":"400"} ${z*0.3528}px Helvetica, Arial, sans-serif`; return _mctx.measureText(s).width;};
      while(f(sz)>maxW && sz>3) sz-=0.5;
      out.push(`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${(sz*0.3528).toFixed(3)}" font-weight="${bold?700:400}" text-anchor="${align==="center"?"middle":"start"}">${esc(s)}</text>`); } };
}
function pdfPainter(d, ox=0, oy=0){
  return { rect:(x,y,w,h)=>d.rect(ox+x,oy+y,w,h,"F"),
    text:(s,x,y,size,bold,align,maxW)=>{ d.setFont("helvetica",bold?"bold":"normal"); let sz=size; d.setFontSize(sz); while(d.getTextWidth(s)>maxW && sz>3){ sz-=0.5; d.setFontSize(sz);} d.text(s,ox+x,oy+y,{align}); } };
}

async function saveFile(name, blob, fallback){
  if (cap.downloads){
    try{ await cap.downloads.save({filename:name, data:blob}); return true; }
    catch(e){ if(e&&e.code==="declined") return false; toast(e&&e.code==="rate_limited"?"Aguarde um instante e tente de novo.":"Não foi possível gerar o arquivo."); return false; }
  }
  const C=window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()){
    try{
      const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
      const {Filesystem, Share}=C.Plugins;
      const w=await Filesystem.writeFile({path:name, data:b64, directory:"CACHE"});
      await Share.share({title:name, url:w.uri, dialogTitle:"Salvar ou enviar arquivo"});
      return true;
    }catch(e){ if(/cancel/i.test(String(e&&e.message||e))) return false; console.error(e); toast("Não foi possível salvar o arquivo."); return false; }
  }
  if (S.mode!=="db"){
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
  }
  toast("Download indisponível nesta visualização."); return false;
}
function etqPDF(kind){
  const codes=etqCodes(); if(!codes.length){ toast("Selecione ao menos um equipamento."); return; }
  if(!window.jspdf || !window.qrcode){ toast("As bibliotecas de PDF não carregaram. Recarregue a página."); return; }
  const {jsPDF}=window.jspdf; const [W,H]=SIZES[L.size]; const o={W,H,top:L.top.trim(),bottom:L.bottom.trim()};
  let d;
  try{
    if (kind==="grafica"){
      const b=L.bleed?2:0, PW=W+2*b, PH=H+2*b;
      d=new jsPDF({unit:"mm",format:[PW,PH],orientation:PW>=PH?"landscape":"portrait",compress:true});
      codes.forEach((c,i)=>{ if(i) d.addPage([PW,PH],PW>=PH?"landscape":"portrait"); drawLabel(pdfPainter(d,b,b),{...o,code:c.code,qrText:qrOf(c.code)}); });
    } else {
      d=new jsPDF({unit:"mm",format:"a4",compress:true});
      const mg=10, g=4, cols=Math.max(1,Math.floor((210-2*mg+g)/(W+g))), rows=Math.max(1,Math.floor((297-2*mg-6+g)/(H+g))), per=cols*rows, pages=Math.ceil(codes.length/per);
      codes.forEach((c,i)=>{
        const pi=Math.floor(i/per), k=i%per;
        if(k===0){ if(pi) d.addPage("a4","portrait"); d.setFont("helvetica","normal"); d.setFontSize(7); d.setTextColor(120); d.text(`Gestão de Ativos · etiquetas ${W}×${H} mm · imprimir em tamanho real (100%) · página ${pi+1}/${pages}`, mg, mg-3); d.setTextColor(0); }
        const x=mg+(k%cols)*(W+g), y=mg+2+Math.floor(k/cols)*(H+g);
        d.setDrawColor(190); d.setLineWidth(0.1); d.rect(x,y,W,H,"S");
        drawLabel(pdfPainter(d,x,y),{...o,code:c.code,qrText:qrOf(c.code)});
      });
    }
  }catch(e){ console.error(e); toast("Algum código tem caracteres inválidos (use letras sem acento e números)."); return; }
  const day=new Date().toISOString().slice(0,10);
  const name = kind==="grafica" ? `etiquetas_${W}x${H}mm_${codes.length}un_${day}.pdf` : `etiquetas_teste_A4_${W}x${H}mm_${day}.pdf`;
  saveFile(name, new Blob([d.output("arraybuffer")]), ()=>d.save(name)).then(ok=>{ if(ok) toast(`PDF com ${codes.length} etiquetas gerado.`); });
}
function etqCSV(){

  const text="﻿"+lines.join("\r\n"); const name=`etiquetas_dados_${new Date().toISOString().slice(0,10)}.csv`;
  saveFile(name, new Blob([text],{type:"text/csv"}), ()=>{ const w=XLSX.utils.aoa_to_sheet(lines.map(l=>l.split(";").map(s=>s.replace(/^"|"$/g,"")))); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,w,"etiquetas"); XLSX.writeFile(wb,name,{bookType:"csv"}); });
}

function invScan(raw){
  let c=String(raw||"").trim(); if(!c) return; if(c.includes("#")) c=c.split("#").pop(); c=c.toUpperCase();
  const fb=document.getElementById("fb");
  const now=new Date().toISOString(); const cur=INV?{...INV,encontrados:{...(INV.encontrados||{})},extras:[...(INV.extras||[])]}:{inicio:now,encontrados:{},extras:[]};
  const x=S.items.find(i=>norm(i.dispositivo)===norm(c));
  if (!x){ if(!cur.extras.some(e=>e.code===c)) cur.extras.push({code:c,em:now}); fb.className="fb bad"; fb.textContent=`${c} não está cadastrado. Anotado na lista de códigos sem cadastro.`; }
  else if (x.status==="Descartado"){ fb.className="fb bad"; fb.textContent=`${c} está marcado como Descartado. Verifique o status.`; }
  else if (cur.encontrados[x.id]){ fb.className="fb dup"; fb.textContent=`${c} já foi conferido às ${fmtDT(cur.encontrados[x.id])}.`; updateInv(); return; }
  else { cur.encontrados[x.id]=now; fb.className="fb ok"; fb.textContent=`✓ ${c} conferido · ${[x.usuario,x.setor].filter(Boolean).join(" · ")||x.status}`; }
  invSave(cur); updateInv();
}
