// ---------- importação do formulário do RH (Google Forms → Planilha → Excel/CSV) ----------
function lerData(v){
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v==="number" && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()); }   // número de série do Excel
  const s=String(v||"").trim(); let m;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)); }
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?/))) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return null;
}
const isoDia = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : null;
function mapearColunas(hdr){
  const map=[], usados={}; let ultimo=null;
  hdr.forEach((h,i)=>{ const n=norm(h); let k=null;
    if(/^carimbo|^timestamp|^datahora$/.test(n)) k="carimbo";
    else if(/^nome(do|da)?(funcionario|colaborador|completo)?$/.test(n)||n==="colaborador"||n==="funcionario") k="nome";
    else if(n.startsWith("cargo")||n==="funcao") k="cargo";
    else if(n.startsWith("departamento")||n==="setor"||n==="area") k="departamento";
    else if(n.startsWith("unidade")||n==="filial"||n==="local") k="unidade";
    else if(n.startsWith("emailcorporativo")) k="email_corporativo";
    else if(n.includes("admissao")) k="data_admissao";
    else if(n.startsWith("equipamento")){ k="equipamentos"; }
    else if(n.startsWith("software")||n.startsWith("sistema")){ k="softwares"; }
    else if(n.startsWith("rede")||n.startsWith("compartilhamento")||n.startsWith("acessoarede")){ k="rede"; }
    else if(n.startsWith("outro")) k=(ultimo&&!usados[ultimo+"_outros"])?ultimo+"_outros":"outros";
    else if(n==="enderecodeemail"||n==="email"||n==="emaildosolicitante") k="solicitante";
    else if(n==="cpf"||n.startsWith("cpf")) k="cpf";
    else if(n.startsWith("telefone")||n.startsWith("celular")||n==="whatsapp") k="telefone";
    if(k&&usados[k]&&k!=="outros") k=null;
    if(k){ usados[k]=true; if(["equipamentos","softwares","rede"].includes(k)) ultimo=k; else if(!k.endsWith("_outros")) ultimo=null; }
    map[i]=k; });
  return map;
}
function separarOpcoes(txt, grupo){
  const ops=S.onbOpc.filter(x=>x.grupo===grupo).map(x=>x.nome); const ok=[], resto=[];
  String(txt||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    const op=ops.find(o=>norm(o)===norm(p))||ops.find(o=>norm(p).length>=3&&(norm(o).startsWith(norm(p))||norm(p).startsWith(norm(o))));
    if(op){ if(!ok.includes(op)) ok.push(op); } else resto.push(p.replace(/^outros?:\s*/i,"")); });
  return [ok, resto];
}
document.getElementById("importOnb").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true});
    const hdr=(aoa[0]||[]).map(String), map=mapearColunas(hdr);
    const linhas=aoa.slice(1).filter(r=>r.some(c=>String(c).trim()));
    const rows=linhas.map(r=>{ const o={equipamentos:[],softwares:[],rede:[]}, out={equipamentos:[],softwares:[],rede:[]};
      map.forEach((k,i)=>{ if(!k) return; const v=r[i];
        if(k==="carimbo"){ o.carimbo=lerData(v); return; }
        if(k==="data_admissao"){ o.data_admissao=isoDia(lerData(v)); return; }
        if(["equipamentos","softwares","rede"].includes(k)){ const [ok,resto]=separarOpcoes(v,{equipamentos:"equipamento",softwares:"software",rede:"rede"}[k]); o[k]=ok; out[k]=resto; return; }
        o[k]=String(v instanceof Date?isoDia(v):v).trim(); });
      ["equipamentos","softwares","rede"].forEach(k=>{ const ex=[...out[k], o[k+"_outros"]].filter(Boolean).join(", "); o[k+"_outros"]=ex; });
      o.nome=String(o.nome||"").replace(/\s+/g," ").trim();
      o.ref="form:"+(o.carimbo?o.carimbo.toISOString():"")+"|"+norm(o.nome)+"|"+(o.data_admissao||"");
      o.dup=S.onb.some(x=>x.origem_ref===o.ref) || S.onb.some(x=>norm(x.nome)===norm(o.nome)&&x.data_admissao===o.data_admissao&&x.status!=="cancelado");
      o.erro=!o.nome?"Sem nome":"";
      return o; });
    OIMP={rows, nome:f.name, cpfCol:map.includes("cpf")};
    const rec=hdr.filter((h,i)=>map[i]), ign=hdr.filter((h,i)=>!map[i]&&String(h).trim());
    const novos=rows.filter(r=>!r.dup&&!r.erro);
    openModal(`<h2>Importar respostas do formulário</h2><div class="msg">
      <p>A planilha <b>${esc(f.name)}</b> tem <b>${rows.length}</b> respostas: <b>${novos.length}</b> novas e <b>${rows.length-novos.length}</b> já importadas ou incompletas, que serão ignoradas.</p>
      ${novos.length?`<div class="tablewrap" style="border:1px solid var(--border);border-radius:12px;max-height:300px;overflow:auto"><table style="min-width:640px"><thead><tr><th>Nome</th><th>Cargo</th><th>Departamento</th><th>Admissão</th><th>Equipamentos</th></tr></thead><tbody>
        ${novos.map(r=>`<tr><td class="dev">${esc(r.nome)}</td><td>${esc(r.cargo||"—")}</td><td>${esc(r.departamento||"—")}</td><td>${esc(fDia(r.data_admissao)||"—")}</td><td>${esc([...r.equipamentos,r.equipamentos_outros].filter(Boolean).join(", ")||"—")}</td></tr>`).join("")}</tbody></table></div>`:""}
      <p class="note" style="margin-top:12px">Colunas reconhecidas: <span class="hdrs">${rec.map(esc).join(", ")||"nenhuma"}</span>${ign.length?`<br>Ignoradas: <span class="hdrs">${ign.map(esc).join(", ")}</span>`:""}
      ${OIMP.cpfCol&&!veCPF()?`<br>A coluna CPF não será importada: só o RH e administradores podem gravar CPF.`:""}</p>
    </div><div class="foot"><button class="btn ghost" data-act="close">Cancelar</button>${novos.length?`<button class="btn primary" data-act="doimpo" id="oiBtn">${ICON("up")}Importar ${novos.length} ${novos.length===1?"solicitação":"solicitações"}</button>`:""}</div>`,"md");
  }catch(err){ console.error(err); toast("Não foi possível ler a planilha. Use .xlsx, .xls ou .csv."); }
});
async function doImportOnb(){
  if(!OIMP) return; const fila=OIMP.rows.filter(r=>!r.dup&&!r.erro); const btn=document.getElementById("oiBtn"); btn.disabled=true;
  let n=0, falhas=0;
  for(const r of fila){
    btn.textContent=`Importando ${n+1}/${fila.length}…`;
    const id=newId();
    const {error}=await sb.from("onboardings").insert({id,nome:r.nome,cargo:r.cargo||"",departamento:r.departamento||"",unidade:r.unidade||"",email_corporativo:String(r.email_corporativo||"").toLowerCase(),
      telefone:r.telefone||"",data_admissao:r.data_admissao||null,equipamentos:r.equipamentos,equipamentos_outros:r.equipamentos_outros||"",softwares:r.softwares,softwares_outros:r.softwares_outros||"",
      rede:r.rede,rede_outros:r.rede_outros||"",outros:r.outros||"",solicitante_nome:r.solicitante||"Formulário do RH",origem:"formulario",origem_ref:r.ref,
      solicitado_em:r.carimbo?r.carimbo.toISOString():null});
    if(error){ console.error(error); if(error.code!=="23505") falhas++; continue; }
    const cpf=String(r.cpf||"").replace(/\D/g,"");
    if(cpf && veCPF()){ const {error:e2}=await sb.from("onboarding_privado").upsert({onboarding_id:id,cpf}); if(e2) console.error(e2); }
    n++;
  }

  toast(falhas?`${n} importadas, ${falhas} com erro.`:`${n} ${n===1?"solicitação importada":"solicitações importadas"}.`);
}

async function onbCfgSalvar(el){

function compraAlertas(o, out){
  if(!OST_ABERTOS.includes(o.status)) return;
  oCompras(o.id).filter(c=>CABERTAS.includes(c.status)).forEach(c=>{
    const nome=`${c.quantidade}× ${c.item}`;
    if(c.previsao && diasAte(c.previsao)<0) out.push({o,n:1,c:"late",t:`Compra de ${nome} atrasada (previsão ${fDia(c.previsao)})`});
    else if(c.previsao && o.data_admissao && c.previsao>o.data_admissao) out.push({o,n:2,c:"warn",t:`Compra de ${nome} chega depois da admissão (previsão ${fDia(c.previsao)})`});
    else if(CPEND.includes(c.status) && Date.now()-new Date(c.criado_em)>864e5) out.push({o,n:3,c:"warn",t:`Compra de ${nome} aguardando aprovação há ${Math.floor((Date.now()-new Date(c.criado_em))/864e5)} dia(s)`});
  });
  oCompras(o.id).filter(c=>c.status==="reprovada").forEach(c=>out.push({o,n:3,c:"warn",t:`Compra de ${c.quantidade}× ${c.item} reprovada${c.decisao_obs?`: ${c.decisao_obs}`:""}`}));

function compraBotoes(c, o, ti){
  const b=(act,ic,l,cls="")=>`<button class="btn sm ${cls}" data-act="${act}" data-id="${o.id}" data-cid="${c.id}">${ICON(ic)}${l}</button>`, x=[];

  if(c.status==="aprovada" && (ti||podeAprovar())) x.push(b("ccomprar","cart","Registrar compra", ti?"":"primary"));
  if(ti && ["aprovada","comprada"].includes(c.status)) x.push(["renovacao","manutencao"].includes(c.finalidade)?b("cconcluir","check","Concluir","primary"):b("creceber","check","Receber","primary"));
  if(ti && c.status==="reprovada") x.push(b("creenv","undo","Reenviar para aprovação"));
  if(ti && (CABERTAS.includes(c.status)||c.status==="reprovada")) x.push(b("cedit","edit","Editar"));
  if(ti && pend && c.onboarding_id) x.push(b("cemail","mail","E-mail"));
  if(ti && (CABERTAS.includes(c.status)||c.status==="reprovada")) x.push(b("ccanc","x","Cancelar","ghost"));
  if(SB_ROLE==="admin" && !["aprovada","comprada","recebida"].includes(c.status)) x.push(b("cexcluir","trash","Excluir","ghost del"));

async function submitCompra(f){
  const fd=new FormData(f), g=k=>String(fd.get(k)||"").trim(), cid=f.dataset.cid;
  const vs=g("valor_unit").replace(/[^\d,.-]/g,""), valor=vs?Number(vs.includes(",")?vs.replace(/\./g,"").replace(",","."):vs):null;

// ---------- estoque e ressuprimento ----------
// Estoque = ativos "Disponível" de cada categoria (periféricos: por tipo). Nada é digitado à parte.
// Demanda = itens pedidos em onboardings abertos que ainda não têm ativo vinculado nem compra própria.
// Projetado = disponível + reposição em andamento − demanda.
const EST = { hist:null, carregando:false, todas:false };
const estChave = (t, sub) => t==="periferico" ? `periferico:${sub||"Outro"}` : t;
const estSub = x => (x && String(x).trim()) || "Outro";
const estDaCat = (r, t, sub) => t===r.t && (t!=="periferico" || estSub(sub)===r.sub);
async function estLoadHist(){
  if(!sb || EST.carregando || SO_ONB()) return; EST.carregando=true;
  try{
    const desde=new Date(Date.now()-90*864e5).toISOString();
    const rows=await pageAll(()=>sb.from("ativos_historico").select("ativo_id,em").eq("campo","status").eq("para","Em uso").gte("em",desde).order("id"));
    EST.hist=rows;
  }catch(e){ console.error(e); EST.hist=[]; }
  EST.carregando=false;
}
function estLinhas(){
  const subs=new Set([...S.items.filter(i=>i.tipo==="periferico").map(i=>estSub(i.subtipo)),
    ...S.onbOpc.filter(o=>o.grupo==="equipamento"&&o.tipo_ativo==="periferico"&&o.subtipo).map(o=>o.subtipo),
    ...S.estMin.filter(m=>m.tipo_ativo==="periferico").map(m=>estSub(m.subtipo))]);
  const cats=[...Object.keys(TYPES).filter(k=>k!=="periferico"&&!TYPES[k].infra).map(k=>({k,t:k,sub:null,nome:TYPES[k].label,um:TYPES[k].one})),
    ...[...subs].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(s=>({k:estChave("periferico",s),t:"periferico",sub:s,nome:`${s} (periférico)`,um:s}))];
  const dem=[]; S.onb.filter(o=>OST_ABERTOS.includes(o.status)).forEach(o=>casar(o).ped.forEach(r=>{ if(!r.links.length&&!r.compra&&r.op&&r.op.tipo_ativo) dem.push({o,t:r.op.tipo_ativo,sub:r.op.subtipo}); }));
  const rep=S.onbCompras.filter(c=>c.origem==="reposicao"&&CABERTAS.includes(c.status));
  const porId=new Map(S.items.map(i=>[i.id,i]));
  return cats.map(r=>{
    const it=S.items.filter(i=>estDaCat(r,i.tipo,i.subtipo)), n=st=>it.filter(i=>i.status===st).length;
    const disp=n("Disponível"), resv=n("Reservado"), man=n("Manutenção"), uso=n("Em uso");
    const emRep=rep.filter(c=>estDaCat(r,c.tipo_ativo,c.subtipo)).reduce((s,c)=>s+c.quantidade,0);
    const ds=dem.filter(d=>estDaCat(r,d.t,d.sub));
    const m=S.estMin.find(m=>m.chave===r.k), temMin=!!m&&(m.minimo>0||m.ideal!=null);
    const min=temMin?m.minimo:null, ideal=temMin?(m.ideal!=null?m.ideal:m.minimo):null;
    const proj=disp+emRep-ds.length;
    const cons=EST.hist?EST.hist.filter(h=>{ const i=porId.get(h.ativo_id); return i&&estDaCat(r,i.tipo,i.subtipo); }).length:null;
    let sit="ok";
    if(min==null) sit=ds.length>disp?"falta":"sem";
    else if(proj<min) sit="repor";
    else if(disp-ds.length<min) sit="chegando";
    const alvo=ideal!=null?ideal:(min||0), sug=Math.max(0, alvo-proj, ds.length-disp-emRep);
    return {...r,disp,resv,man,uso,emRep,demanda:ds.length,dem:ds,proj,min,ideal:temMin?m.ideal:null,sit,sug,total:it.length,cons};
  });
}

    const nm=`${tipoUm(x.tipo)} ${x.dispositivo}`;
    if(x.garantia_ate){ const d=diasAte(x.garantia_ate); if(d<0&&d>=-90) out.push({x,n:2,c:"warn",t:`${nm}: garantia venceu em ${fDia(x.garantia_ate)}`}); else if(d>=0&&d<=60) out.push({x,n:1,c:"soon",t:`${nm}: garantia vence em ${fDia(x.garantia_ate)}`}); }
    const sp=substPrev(x); if(sp){ const d=diasAte(sp); if(d<0) out.push({x,n:1,c:"late",t:`${nm}: substituição prevista para ${fDia(sp)} (atrasada)`}); else if(d<=180) out.push({x,n:3,c:"soon",t:`${nm}: substituição prevista para ${fDia(sp)}`}); }
    if(x.licenca_ate){ const d=diasAte(x.licenca_ate); if(d<=60) out.push({x,n:d<0?0:1,c:d<0?"late":"soon",t:`${nm}: licença ${d<0?"vencida":"vence"} em ${fDia(x.licenca_ate)}`}); }
    if(x.troca_bateria){ const d=diasAte(x.troca_bateria); if(d<=60) out.push({x,n:d<0?0:1,c:d<0?"late":"soon",t:`${nm}: troca de bateria ${d<0?"atrasada desde":"prevista para"} ${fDia(x.troca_bateria)}`}); }
    const um=ultimaManut(x.id).find(m=>m.proxima); if(um){ const d=diasAte(um.proxima); if(d<=15) out.push({x,n:d<0?0:2,c:d<0?"late":"soon",t:`${nm}: ${MANT[um.tipo].toLowerCase()} ${d<0?"atrasada desde":"prevista para"} ${fDia(um.proxima)}`}); }
    if(INFRA(x.tipo)&&x.status==="Manutenção") out.push({x,n:0,c:"late",t:`${nm} em manutenção${sistemasDe(x.id).length?` · afeta ${sistemasDe(x.id).map(s=>s.nome).join(", ")}`:""}`});
  });
  return out.sort((a,b)=>a.n-b.n);
}

        ${cs.map(c=>{ const aqui=c.origem_id===x.id, outroId=aqui?c.destino_id:c.origem_id, outro=outroId?ativoDe(outroId):null;

  // compras ligadas ao equipamento
  const cps=S.onbCompras.filter(c=>c.ativo_ref===x.id&&c.status!=="cancelada");
  if(INFRA(x.tipo)||cps.length) h+=`<div class="hist"><div class="panelhead" style="margin:0 0 6px"><label style="margin:0">Compras (${cps.length})</label>${ti&&INFRA(x.tipo)?`<button class="btn sm" data-act="icompra" data-id="${x.id}">${ICON("cart")}Solicitar compra</button>`:""}</div>

  // manutenções (todos os ativos)
  const ms=ultimaManut(x.id);
  h+=`<div class="hist"><div class="panelhead" style="margin:0 0 6px"><label style="margin:0">Manutenções (${ms.length})</label>${ti?`<button class="btn sm" data-act="imant" data-id="${x.id}">${ICON("plus")}Registrar manutenção</button>`:""}</div>

  return h;
}

  const lado={porta:g("porta"), porta2:g("porta2")};

  if(aqui){ Object.assign(row,{origem_id:id,origem_porta:lado.porta,destino_id:outro?outro.id:null,destino_desc:outro?"":outroTxt,destino_porta:lado.porta2}); }

  const {error}=cid?await sb.from("infra_conexoes").update(row).eq("id",+cid):await sb.from("infra_conexoes").insert(row);

  await infraLoad(); viewItem(id); toast("Conexão salva.");
}

function racksHTML(){

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){
  const vals=[104]; for(const ch of text){ const c=ch.charCodeAt(0); if(c<32||c>126) throw new Error("Caractere inválido"); vals.push(c-32); }
  let sum=104; for(let i=1;i<vals.length;i++) sum+=vals[i]*i;
  vals.push(sum%103); vals.push(106);
  const bars=[]; let x=0;
  vals.forEach(v=>{ const p=C128[v]; for(let i=0;i<p.length;i++){ const w=+p[i]; if(i%2===0) bars.push([x,w]); x+=w; } });
  return {bars, modules:x};
}
// p = pincel: rect(x,y,w,h), text(str,x,y,sizePt,bold,align,maxW) — coordenadas em mm
function drawLabel(p, o){
  const {W,H,code,qrText,top,bottom} = o;
  const m = Math.max(1.2, H*0.06), hb = H*0.27, gap = H*0.045;
  const topH = H - 2*m - hb - gap - (bottom ? H*0.08 : 0);
  const qr = qrcode(0, "M"); qr.addData(qrText); qr.make();
  const n = qr.getModuleCount(), qs = topH, ms = qs/n;
  for(let r=0;r<n;r++){ let c=0; while(c<n){ if(qr.isDark(r,c)){ let e=c; while(e+1<n && qr.isDark(r,e+1)) e++; p.rect(m+c*ms, m+r*ms, (e-c+1)*ms+0.01, ms+0.01); c=e+1; } else c++; } }
  const tx = m + qs + H*0.07, tw = W - tx - m, pt = mm => mm/0.3528;
  const hTop = top ? topH*0.22 : 0, sp = top ? topH*0.06 : 0;
  if (top) p.text(top, tx, m + hTop*0.82, pt(hTop*0.78), true, "left", tw);
  const codeH = topH - hTop - sp;
  p.text(code, tx, m + hTop + sp + codeH*0.78, pt(Math.min(codeH*0.95, tw/(code.length*0.62))), true, "left", tw);
  const {bars, modules} = code128(code);
  const bw = W - 2*m, xd = bw/(modules+20), by = m + topH + gap;
  bars.forEach(([x,w]) => p.rect(m + (10+x)*xd, by, w*xd, hb));
  if (bottom) p.text(bottom, W/2, H - m*0.75, pt(H*0.075), false, "center", W-2*m);
}
const _mctx = document.createElement("canvas").getContext("2d");
function svgPainter(){
  const out=[];
  return { out,
    rect:(x,y,w,h)=>out.push(`<rect x="${x.toFixed(3)}" y="${y.toFixed(3)}" width="${w.toFixed(3)}" height="${h.toFixed(3)}"/>`),
    text:(s,x,y,size,bold,align,maxW)=>{ let sz=size; const f=z=>{_mctx.font=`${bold?"700":"400"} ${z*0.3528}px Helvetica, Arial, sans-serif`; return _mctx.measureText(s).width;};
      while(f(sz)>maxW && sz>3) sz-=0.5;
      out.push(`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${(sz*0.3528).toFixed(3)}" font-weight="${bold?700:400}" text-anchor="${align==="center"?"middle":"start"}">${esc(s)}</text>`); } };
}
function pdfPainter(d, ox=0, oy=0){
  return { rect:(x,y,w,h)=>d.rect(ox+x,oy+y,w,h,"F"),
    text:(s,x,y,size,bold,align,maxW)=>{ d.setFont("helvetica",bold?"bold":"normal"); let sz=size; d.setFontSize(sz); while(d.getTextWidth(s)>maxW && sz>3){ sz-=0.5; d.setFontSize(sz);} d.text(s,ox+x,oy+y,{align}); } };
}

async function saveFile(name, blob, fallback){
  if (cap.downloads){
    try{ await cap.downloads.save({filename:name, data:blob}); return true; }
    catch(e){ if(e&&e.code==="declined") return false; toast(e&&e.code==="rate_limited"?"Aguarde um instante e tente de novo.":"Não foi possível gerar o arquivo."); return false; }
  }
  const C=window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()){
    try{
      const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
      const {Filesystem, Share}=C.Plugins;
      const w=await Filesystem.writeFile({path:name, data:b64, directory:"CACHE"});
      await Share.share({title:name, url:w.uri, dialogTitle:"Salvar ou enviar arquivo"});
      return true;
    }catch(e){ if(/cancel/i.test(String(e&&e.message||e))) return false; console.error(e); toast("Não foi possível salvar o arquivo."); return false; }
  }
  if (S.mode!=="db"){
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
  }
  toast("Download indisponível nesta visualização."); return false;
}
function etqPDF(kind){
  const codes=etqCodes(); if(!codes.length){ toast("Selecione ao menos um equipamento."); return; }
  if(!window.jspdf || !window.qrcode){ toast("As bibliotecas de PDF não carregaram. Recarregue a página."); return; }
  const {jsPDF}=window.jspdf; const [W,H]=SIZES[L.size]; const o={W,H,top:L.top.trim(),bottom:L.bottom.trim()};
  let d;
  try{
    if (kind==="grafica"){
      const b=L.bleed?2:0, PW=W+2*b, PH=H+2*b;
      d=new jsPDF({unit:"mm",format:[PW,PH],orientation:PW>=PH?"landscape":"portrait",compress:true});
      codes.forEach((c,i)=>{ if(i) d.addPage([PW,PH],PW>=PH?"landscape":"portrait"); drawLabel(pdfPainter(d,b,b),{...o,code:c.code,qrText:qrOf(c.code)}); });
    } else {
      d=new jsPDF({unit:"mm",format:"a4",compress:true});
      const mg=10, g=4, cols=Math.max(1,Math.floor((210-2*mg+g)/(W+g))), rows=Math.max(1,Math.floor((297-2*mg-6+g)/(H+g))), per=cols*rows, pages=Math.ceil(codes.length/per);
      codes.forEach((c,i)=>{
        const pi=Math.floor(i/per), k=i%per;
        if(k===0){ if(pi) d.addPage("a4","portrait"); d.setFont("helvetica","normal"); d.setFontSize(7); d.setTextColor(120); d.text(`Gestão de Ativos · etiquetas ${W}×${H} mm · imprimir em tamanho real (100%) · página ${pi+1}/${pages}`, mg, mg-3); d.setTextColor(0); }
        const x=mg+(k%cols)*(W+g), y=mg+2+Math.floor(k/cols)*(H+g);
        d.setDrawColor(190); d.setLineWidth(0.1); d.rect(x,y,W,H,"S");
        drawLabel(pdfPainter(d,x,y),{...o,code:c.code,qrText:qrOf(c.code)});
      });
    }
  }catch(e){ console.error(e); toast("Algum código tem caracteres inválidos (use letras sem acento e números)."); return; }
  const day=new Date().toISOString().slice(0,10);
  const name = kind==="grafica" ? `etiquetas_${W}x${H}mm_${codes.length}un_${day}.pdf` : `etiquetas_teste_A4_${W}x${H}mm_${day}.pdf`;
  saveFile(name, new Blob([d.output("arraybuffer")]), ()=>d.save(name)).then(ok=>{ if(ok) toast(`PDF com ${codes.length} etiquetas gerado.`); });
}

function etqCopy(){
  const codes=etqCodes(); const [W,H]=SIZES[L.size];
  const txt=`Olá! Gostaria de um orçamento de etiquetas patrimoniais personalizadas:
- Quantidade: ${codes.length} etiquetas, cada uma com numeração diferente (envio PDF com uma arte por página)
- Tamanho: ${W} x ${H} mm
- Material: poliéster ou vinil branco, adesivo permanente (se tiver, cotar também a versão antiviolação/VOID)
- Impressão: 1 cor (preto), sem ampliar nem reduzir a arte, pois tem QR Code e código de barras
- Acabamento: meio-corte, em rolo ou cartela
Podem me passar prazo e valor? Obrigado!`;
  const fallback=()=>openModal(`<h2>Mensagem para a gráfica</h2><div class="msg"><p>Selecione o texto e copie:</p><label class="fld"><textarea id="copyTxt" style="min-height:220px">${esc(txt)}</textarea></label></div>`,"sm");
  try{ navigator.clipboard.writeText(txt).then(()=>toast("Mensagem copiada."), fallback); }catch(e){ fallback(); }
}

// ---------- inventário (conferência com coletor) ----------
const IKEY="gestao-ativos-inv"; let INV=null; let INVCAT="todos"; let invLast=null; let invQ=Promise.resolve();
const invBase = () => S.items.filter(x=>x.status!=="Descartado");
function invSave(next){
  INV=next;
  if (sb){ invQ = invQ.then(async()=>{ const {error}=await sb.from("inventario").upsert({id:"atual",inicio:next.inicio,encontrados:next.encontrados,extras:next.extras}); if(error) throw error; }).catch(writeErr); return; }
  if (cap.db){ invQ = invQ.then(()=>cap.db.doc("inventario/atual").set(next)).catch(writeErr); }
  else { try{ localStorage.setItem(IKEY, JSON.stringify(next)); }catch(e){} }
}
function invShell(){
  return `<div class="head"><div><h1>Inventário</h1><div class="sub" id="invSub"></div></div>
    <div class="actions"><button class="btn" data-act="invexp">${ICON("down")}Exportar resultado</button><button class="btn primary" data-act="invnew">${ICON("plus")}Novo inventário</button></div></div>
  <div class="card scan" style="margin-bottom:20px">
    <label class="scanbox">${ICON("scan")}<input id="scanIn" placeholder="Bipe ou digite o código" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código do equipamento"></label>
    <div class="fb" id="fb">Aponte o coletor para a etiqueta. O código entra aqui e é conferido na hora.</div>
  </div>
  <div class="grid2">
    <section class="card panel"><h2>Progresso</h2><div id="invProg"></div></section>
    <section class="card panel"><div class="panelhead"><h2 id="pendH">Pendentes</h2><select id="invCat" aria-label="Categoria"><option value="todos">Todas</option>${Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${INVCAT===k?"selected":""}>${t.label}</option>`).join("")}</select></div><div class="list scroll" id="invPend"></div></section>
    <section class="card panel"><h2 id="doneH">Conferidos</h2><div class="list scroll" id="invDone"></div></section>
    <section class="card panel"><h2 id="extH">Códigos lidos sem cadastro</h2><div id="invExt"></div></section>
  </div>`;
}
const fmtDT = iso => { try{ return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
function updateInv(){
  const pend=document.getElementById("invPend"); if(!pend) return;
  const base=invBase(), enc=(INV&&INV.encontrados)||{};
  const done=base.filter(x=>enc[x.id]), pct=base.length?Math.round(done.length/base.length*100):0;
  document.getElementById("invSub").textContent = INV ? `Iniciado em ${fmtDT(INV.inicio)} · ${done.length} de ${base.length} equipamentos conferidos` : "Nenhum inventário em andamento. Bipe o primeiro código para começar.";
  document.getElementById("invProg").innerHTML = `<div class="prog"><span class="pct">${pct}%</span><div class="track2"><i style="width:${pct}%"></i></div></div>
    ${Object.entries(TYPES).map(([k,t])=>{ const b=base.filter(x=>x.tipo===k); if(!b.length) return ""; const d=b.filter(x=>enc[x.id]).length;
      return `<div class="bar"><span>${t.label}</span><div class="track"><div class="fill" style="width:${d/b.length*100}%"></div></div><b>${d}/${b.length}</b></div>`; }).join("")}
    <p class="muted" style="margin:14px 0 0;font-size:13.5px">Equipamentos com status Descartado não entram na conferência.</p>`;
  const pl=base.filter(x=>!enc[x.id] && (INVCAT==="todos"||x.tipo===INVCAT)).sort(sortDev).reverse();
  document.getElementById("pendH").textContent=`Pendentes (${pl.length})`;
  pend.innerHTML = pl.length ? pl.map(x=>`<div class="li" data-act="view" data-id="${x.id}"><b>${esc(x.dispositivo)}</b><span>${esc([x.usuario||x.status,x.setor].filter(Boolean).join(" · "))}</span>${ICON("eye")}</div>`).join("") : `<p class="muted">Tudo conferido nesta categoria.</p>`;
  const dl=done.sort((a,b)=>String(enc[b.id]).localeCompare(String(enc[a.id])));
  document.getElementById("doneH").textContent=`Conferidos (${dl.length})`;
  document.getElementById("invDone").innerHTML = dl.length ? dl.map(x=>`<div class="li done" data-act="view" data-id="${x.id}"><b>${esc(x.dispositivo)}</b><span>${esc([x.usuario||x.status,x.setor].filter(Boolean).join(" · "))}</span><small class="muted">${fmtDT(enc[x.id])}</small></div>`).join("") : `<p class="muted">Nenhum equipamento conferido ainda.</p>`;
  const ext=(INV&&INV.extras)||[];
  document.getElementById("extH").textContent=`Códigos lidos sem cadastro (${ext.length})`;
  document.getElementById("invExt").innerHTML = ext.length ? `<div class="chips">${ext.map(e=>`<span class="chip">${esc(e.code)}</span>`).join("")}</div><p class="muted" style="font-size:13.5px;margin:12px 0 0">Cadastre esses equipamentos na categoria correspondente.</p>` : `<p class="muted">Nenhum código desconhecido.</p>`;
}
function invScan(raw){
  let c=String(raw||"").trim(); if(!c) return; if(c.includes("#")) c=c.split("#").pop(); c=c.toUpperCase();
  const fb=document.getElementById("fb");
  const now=new Date().toISOString(); const cur=INV?{...INV,encontrados:{...(INV.encontrados||{})},extras:[...(INV.extras||[])]}:{inicio:now,encontrados:{},extras:[]};
  const x=S.items.find(i=>norm(i.dispositivo)===norm(c));
  if (!x){ if(!cur.extras.some(e=>e.code===c)) cur.extras.push({code:c,em:now}); fb.className="fb bad"; fb.textContent=`${c} não está cadastrado. Anotado na lista de códigos sem cadastro.`; }
  else if (x.status==="Descartado"){ fb.className="fb bad"; fb.textContent=`${c} está marcado como Descartado. Verifique o status.`; }
  else if (cur.encontrados[x.id]){ fb.className="fb dup"; fb.textContent=`${c} já foi conferido às ${fmtDT(cur.encontrados[x.id])}.`; updateInv(); return; }
  else { cur.encontrados[x.id]=now; fb.className="fb ok"; fb.textContent=`✓ ${c} conferido · ${[x.usuario,x.setor].filter(Boolean).join(" · ")||x.status}`; }
  invSave(cur); updateInv();
}
function confirmInvNew(){
  openModal(`<h2>Começar um novo inventário?</h2><div class="msg"><p>A conferência atual${INV?` (iniciada em ${fmtDT(INV.inicio)})`:""} será zerada. Exporte o resultado antes se quiser guardar.</p></div>
  <div class="foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="doinvnew">Começar do zero</button></div>`,"sm");
}
function invNew(){ invSave({inicio:new Date().toISOString(),encontrados:{},extras:[]}); closeModal(); updateInv(); toast("Novo inventário iniciado."); setTimeout(()=>document.getElementById("scanIn")?.focus(),50); }
function invExport(){
  if(!window.XLSX){ toast("A biblioteca de Excel não carregou. Recarregue a página."); return; }
  const enc=(INV&&INV.encontrados)||{};
  const rows=invBase().sort(sortDev).reverse().map(x=>({"Dispositivo":x.dispositivo,"Categoria":TYPES[x.tipo]?.one||"","Status":x.status,"Usuário":x.usuario||"","Setor":x.setor||"","Conferido":enc[x.id]?"Sim":"Não","Data/hora":enc[x.id]?fmtDT(enc[x.id]):""}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Conferência");
  const ext=((INV&&INV.extras)||[]).map(e=>({"Código lido":e.code,"Data/hora":fmtDT(e.em)}));
  if(ext.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ext),"Sem cadastro");
  const name=`inventario_TI_${new Date().toISOString().slice(0,10)}.xlsx`;
  saveFile(name,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]),()=>XLSX.writeFile(wb,name)).then(ok=>{ if(ok) toast("Resultado exportado."); });
}
document.addEventListener("keydown", e=>{ if(e.target.id==="scanIn" && e.key==="Enter"){ e.preventDefault(); invScan(e.target.value); e.target.value=""; } });

// ---------- eventos ----------
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="bg"){ if(e.target===el) closeModal(); return; }
  if(a==="go") return go(el.dataset.v);
  if(a==="close") return closeModal();
  if(onbClick(a,el,id)) return;
  if(infraClick(a,el)) return;
  if(a==="view") return viewItem(id);
  if(a==="edit") return editItem(id);
  if(a==="new") return editItem(null,S.view);
  if(a==="del") return confirmDel(id);
  if(a==="dodel") return doDel(id);
  if(a==="pickphoto") return document.getElementById("photoFile").click();
  if(a==="rmphoto"){ pendingPhoto=null; document.getElementById("f_foto").value=""; document.getElementById("prev").innerHTML=ICON("image"); el.remove(); return; }
  if(a==="export") return exportExcel();
  if(a==="import") return document.getElementById("importFile").click();
  if(a==="doimport") return doImport();
  if(a==="uexport") return exportUsers();
  if(a==="tgerar") return gerarTermo(id);
  if(a==="tlink") return linkModal(id);
  if(a==="tcopy") return copiarLink();
  if(a==="tpdf") return termoPDF(id);
  if(a==="tdev") return devolucaoModal(id);
  if(a==="tcancel") return cancelarModal(id);
  if(a==="tdel") return excluirModal(id);
  if(a==="tanexar") return abrirImportTermos(id);
  if(a==="tlote") return abrirImportTermos(null);
  if(a==="impt") return doImportTermos();
  if(a==="tfile") return termoArquivo(id);
  if(a==="dotcancel") return tUpdate(id,{status:"cancelado"},"Termo cancelado.").then(ok=>{ if(ok) closeModal(); });
  if(a==="trenew") return tUpdate(id,{expira_em:new Date(Date.now()+30*864e5).toISOString()},"Link renovado por 30 dias.").then(ok=>{ if(ok) linkModal(id); });
  if(a==="texport") return exportTermos();
  if(a==="tuser"){ const l=el.dataset.login; go("termos"); TF.q=l; TF.st=""; render(); return; }
  if(a==="uimport") return document.getElementById("importUsers").click();
  if(a==="douimport") return doImportUsers();
  if(a==="newuser") return editUser(null,{login:el.dataset.login||"",setor:el.dataset.setor||""});
  if(a==="edituser") return editUser(id);
  if(a==="deluser") return confirmDelUser(id);
  if(a==="logout"){ if(sb) sb.auth.signOut(); return; }
  if(a==="g-criar") return gate("criar");
  if(a==="g-entrar") return gate("entrar");
  if(a==="g-esqueci") return gate("esqueci");
  if(a==="accdel"){ const em=el.dataset.email; return sb.from("membros").delete().eq("email",em).then(({error})=>{ if(error) writeErr(error); else { toast(`Acesso de ${em} removido.`); updateAcessos(); } }); }
  if(a==="etqall"){ etqItems().forEach(x=>L.sel.add(x.id)); return updateEtq(); }
  if(a==="etqnone"){ L.sel.clear(); return updateEtq(); }
  if(a==="etqpdf") return etqPDF("grafica");
  if(a==="etqa4") return etqPDF("a4");
  if(a==="etqcsv") return etqCSV();
  if(a==="etqcopy") return etqCopy();
  if(a==="invnew") return confirmInvNew();
  if(a==="doinvnew") return invNew();
  if(a==="invexp") return invExport();
  if(a==="dodeluser") return store.del("usuarios",id).then(()=>{closeModal();toast("Usuário excluído.");}).catch(writeErr);
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(onbSubmit(e.target)) return;
  if(infraSubmit(e.target)) return;
  if(e.target.id==="itemForm") submitItem(e.target);
  if(e.target.id==="userForm") submitUser(e.target);
  if(e.target.id==="gForm") gateSubmit(e.target);
  if(e.target.id==="termoForm") submitTermo(e.target);
  if(e.target.id==="devForm") doDevolucao(e.target);
  if(e.target.id==="tdelForm") doExcluirTermo(e.target);
  if(e.target.id==="accForm"){ const em=document.getElementById("acc_email").value.trim().toLowerCase(), pp=document.getElementById("acc_papel").value;
    sb.from("membros").upsert({email:em,papel:pp}).then(({error})=>{ if(error) writeErr(error); else { toast(`${em} liberado.`); updateAcessos(); } }); }
});
document.addEventListener("input", e=>{
  if(onbInput(e.target)) return;
  if(e.target.id==="q"){ S.q=e.target.value; updateTable(); }
  if(e.target.id==="uq"){ S.uq=e.target.value; updateUsers(); }
  if(e.target.id==="tq"){ TF.q=e.target.value; updateTermos(); }
  if(e.target.classList && (e.target.classList.contains("impcod")||e.target.classList.contains("implog"))) impCampo(e.target);
  if(e.target.id==="t_login"){ const u=S.users.find(u=>norm(u.login)===norm(e.target.value)); if(u){ const n=document.getElementById("t_nome"), m=document.getElementById("t_email"); if(n&&u.nome) n.value=u.nome; if(m&&u.email) m.value=u.email; } }
  if(e.target.id && e.target.id.startsWith("e_") && e.target.type!=="checkbox" && e.target.tagName!=="SELECT") etqInput(e.target);
});
document.addEventListener("change", e=>{
  if(onbChange(e.target)) return;
  if(e.target.id==="fStatus"){ S.fStatus=e.target.value; updateTable(); }
  if(e.target.id==="fSetor"){ S.fSetor=e.target.value; updateTable(); }
  if(e.target.id && e.target.id.startsWith("e_")) etqInput(e.target);
  if(e.target.classList && e.target.classList.contains("esel")){ const id=e.target.value; e.target.checked?L.sel.add(id):L.sel.delete(id); updateEtq(true); }
  if(e.target.id==="invCat"){ INVCAT=e.target.value; updateInv(); }
  if(e.target.id==="tst"){ TF.st=e.target.value; updateTermos(); }
  if(e.target.id==="tor"){ TF.or=e.target.value; updateTermos(); }
  if(e.target.classList && (e.target.classList.contains("impdt")||e.target.classList.contains("impinc"))) impCampo(e.target);
  if(e.target.classList && e.target.classList.contains("accp")){ const em=e.target.dataset.email; sb.from("membros").update({papel:e.target.value}).eq("email",em).then(({error})=>{ if(error) writeErr(error); else toast(`Permissão de ${em} atualizada.`); }); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && document.querySelector(".overlay")) closeModal(); });

try{ const v=localStorage.getItem("ga-view"); if(v && (["dashboard","usuarios","etiquetas","inventario","termos","onboarding","aprovacoes","estoque","infra","racks","sistemas"].includes(v)||TYPES[v])) S.view=v; }catch(e){}
if (!S.view || S.view==="") S.view="dashboard";
render();
initCaps();
try{
  const native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if ("serviceWorker" in navigator && !native && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
}catch(e){}
})();
